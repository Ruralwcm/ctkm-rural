<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Khảo sát giờ nhận Rau - Thịt · 05-11.10</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#333;min-height:100vh}
.header{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;padding:14px 18px;text-align:center}
.header h1{font-size:17px}.header p{font-size:11px;opacity:0.8;margin-top:2px}
.container{max-width:520px;margin:20px auto;padding:0 12px}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:14px;color:#2e7d32;margin-bottom:14px;display:flex;align-items:center;gap:6px}
label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:#555}
input,select{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:10px;background:#fff}
input:focus,select:focus{border-color:#2e7d32;outline:none}
.row{display:flex;gap:8px}.row>*{flex:1}

/* Store search */
.search-box{position:relative}
.search-results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:0 0 6px 6px;max-height:200px;overflow-y:auto;z-index:10;display:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.search-results.show{display:block}
.search-item{padding:10px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px}
.search-item:hover{background:#e8f5e9}
.search-item .code{font-weight:700;color:#2e7d32}
.search-item .info{font-size:11px;color:#888;margin-top:2px}
.store-filled{background:#e8f5e9;border-radius:6px;padding:12px;margin-bottom:12px;font-size:13px;display:none}
.store-filled .row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.store-filled .tag{background:#fff;padding:3px 8px;border-radius:4px;font-size:11px;border:1px solid #c8e6c9}
.clear-store{font-size:11px;color:#c62828;cursor:pointer;float:right}

/* Time grid */
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btn{width:100%;padding:13px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-primary{background:#2e7d32;color:#fff}
.btn-outline{background:#fff;color:#2e7d32;border:2px solid #2e7d32;margin-top:4px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:6px;color:#fff;font-weight:600;display:none;z-index:100;background:#2e7d32}
.toast.err{background:#c62828}

/* Loading */
.loading{text-align:center;padding:20px;color:#888;display:none}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid #e0e0e0;border-top-color:#2e7d32;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:480px){
  .row{flex-direction:column}
  .time-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="header">
  <h1>🥩🥬 Khảo sát giờ nhận Rau - Thịt</h1>
  <p>Thịt MDL & Rau-Trái cây · 05.10 → 11.10.2026</p>
</div>
<div class="container">
  <div class="loading" id="loading"><span class="spinner"></span>Đang tải dữ liệu cửa hàng...</div>

  <div class="card" id="formCard" style="display:none">
    <h3>🏪 Chọn cửa hàng</h3>
    <label>Miền</label>
    <select id="smien" onchange="onMienChange()"><option value="">-- Chọn Miền --</option></select>
    <label>GĐV</label>
    <select id="sgdv" onchange="onGdvChange()"><option value="">-- Chọn GĐV trước --</option></select>
    <label>QLKV</label>
    <select id="sqlkv" onchange="onQlkvChange()"><option value="">-- Chọn QLKV trước --</option></select>
    <label>Cửa hàng</label>
    <select id="sstore" onchange="onStoreChange()"><option value="">-- Chọn CH trước --</option></select>
    <div class="store-filled" id="storeFilled">
      <strong id="sfMa"></strong> — <span id="sfTen"></span>
      <div class="row2">
        <span class="tag">GĐV: <span id="sfGdv"></span></span>
        <span class="tag">QLKV: <span id="sfQlkv"></span></span>
        <span class="tag">Tỉnh: <span id="sfTinh"></span></span>
      </div>
    </div>
  </div>

  <div class="card" id="timeCard" style="display:none">
    <h3>📅 Ngày nhận hàng</h3>
    <select id="sday"></select>

    <h3 style="margin-top:16px">⏰ Thời gian nhận</h3>
    <div class="time-grid">
      <div><label>🥩 Nhận Thịt MDL</label><select id="smeat"><option value="">-- Chọn giờ --</option><option value="KHONGCO" style="color:#c62828;font-weight:600">❌ Không có lịch giao</option></select></div>
      <div><label>🥬 Nhận Rau - Trái cây</label><select id="sveg"><option value="">-- Chọn giờ --</option><option value="KHONGCO" style="color:#c62828;font-weight:600">❌ Không có lịch giao</option></select></div>
    </div>

    <button class="btn btn-primary" onclick="submitSurvey()">✅ Hoàn thành khảo sát</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== CONFIG =====
const SHEET_ID = '1fMmEm1GC9aei_3oeu2vcadPVsUM9ms9eVhm99d7pF8A';
const SHEET_NAME = 'Store_list';
// Dynamic: chỉ hiện Hôm qua (D-1) & Hôm nay
const WEEKDAYS = ['CN','T2','T3','T4','T5','T6','T7'];
function getAvailableDays() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  return [
    { value: yesterday.toLocaleDateString('vi-VN'), label: WEEKDAYS[yesterday.getDay()] + ' Hôm qua ' + yesterday.toLocaleDateString('vi-VN') },
    { value: today.toLocaleDateString('vi-VN'), label: WEEKDAYS[today.getDay()] + ' Hôm nay ' + today.toLocaleDateString('vi-VN') }
  ];
}
const AVAIL_DAYS = getAvailableDays();
const DAYS = AVAIL_DAYS.map(d => d.value);
const DAY_LABELS = AVAIL_DAYS.map(d => d.label);

let STORES = [];
let selectedStore = null;
let SURVEYS = JSON.parse(localStorage.getItem('ks_nhanhang')||'[]');

// ===== TIME SLOTS =====
function genMeatTimes(){
  let s=[];
  for(let h=6;h<22;h++)for(let m of[0,30]){
    let start=h+'h'+String(m).padStart(2,'0');
    let endH=m===30?h+1:h;
    let endM=m===30?'00':'30';
    s.push({label:start+' - '+endH+'h'+endM, value:String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')});
  }
  return s;
}
function genVegTimes(){
  let s=[];
  for(let h=0;h<24;h++)for(let m of[0,30]){
    let start=h+'h'+String(m).padStart(2,'0');
    let endH=m===30?h+1:h;
    let endM=m===30?'00':'30';
    if(endH===24)continue;
    s.push({label:start+' - '+endH+'h'+endM, value:String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')});
  }
  return s;
}
const MEAT_TIMES=genMeatTimes();
const VEG_TIMES=genVegTimes();

// ===== INIT =====
MEAT_TIMES.forEach(t=>{
  document.getElementById('smeat').innerHTML+=`<option value="${t.value}">${t.label}</option>`;
});
VEG_TIMES.forEach(t=>{
  document.getElementById('sveg').innerHTML+=`<option value="${t.value}">${t.label}</option>`;
});
// "Không có lịch giao" đã có sẵn trong HTML
DAYS.forEach((d,i)=>document.getElementById('sday').innerHTML+=`<option value="${d}">${DAY_LABELS[i]}</option>`);
loadStores();

function loadStores(){
  // Use tqx=out:json to get ALL rows (no default limit)
  let url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?sheet='+encodeURIComponent(SHEET_NAME)+'&tqx=out:json&headers=1';
  fetch(url).then(r=>r.text()).then(txt=>{
    // Parse Google's weird JSONP format
    let json=JSON.parse(txt.substring(txt.indexOf('{'),txt.lastIndexOf('}')+1));
    document.getElementById('loading').style.display='none';
    document.getElementById('formCard').style.display='block';
    
    if(!json.table){document.getElementById('timeCard').style.display='block';return;}
    let dt=json.table;
    let cols=dt.cols.map(c=>c.label||'');
    
    // Find column indices
    let ci={ma:-1,ten:-1,gdv:-1,qlkv:-1,tinh:-1,mien:-1};
    cols.forEach((h,i)=>{
      let hl=h.toLowerCase();
      if(hl.includes('mã')&&(hl.includes('sap')||hl.includes('ch')))ci.ma=i;
      else if(hl.includes('tên')&&hl.includes('hàng'))ci.ten=i;
      else if(hl.includes('gđv')||hl.includes('gdv'))ci.gdv=i;
      else if(hl.includes('qlkv'))ci.qlkv=i;
      else if(hl.includes('tỉnh')||hl.includes('tinh'))ci.tinh=i;
      else if(hl.includes('miền')||hl.includes('mien'))ci.mien=i;
    });
    
    // Fallback: if no QLKV column found, use GĐV for grouping
    if(ci.qlkv<0&&ci.gdv>=0)ci.qlkv=ci.gdv;
    
    STORES=[];
    (dt.rows||[]).forEach(r=>{
      let v=r.c||[];
      STORES.push({
        ma:(v[ci.ma>=0?ci.ma:0]?.v||'').toString(),
        ten:(v[ci.ten>=0?ci.ten:1]?.v||'').toString(),
        gdv:(v[ci.gdv>=0?ci.gdv:2]?.v||'').toString(),
        qlkv:(v[ci.qlkv>=0?ci.qlkv:3]?.v||'').toString(),
        tinh:(v[ci.tinh>=0?ci.tinh:4]?.v||'').toString(),
        mien:(v[ci.mien>=0?ci.mien:5]?.v||'').toString()
      });
    });
    
    document.getElementById('timeCard').style.display='block';
    let miens=[...new Set(STORES.map(s=>s.mien).filter(Boolean))].sort();
    let msel=document.getElementById('smien');
    miens.forEach(m=>msel.innerHTML+=`<option value="${m}">${m}</option>`);
    if(STORES.length===0){showToast('Storelist rỗng','err');}
  }).catch(e=>{
    document.getElementById('loading').style.display='none';
    document.getElementById('formCard').style.display='block';
    document.getElementById('timeCard').style.display='block';
  });
}

// ===== STORE SELECTION (cascading dropdowns) =====
function onMienChange(){
  let m=document.getElementById('smien').value;
  let sel=document.getElementById('sgdv');
  sel.innerHTML='<option value="">-- Chọn GĐV --</option>';
  document.getElementById('sqlkv').innerHTML='<option value="">-- Chọn QLKV trước --</option>';
  document.getElementById('sstore').innerHTML='<option value="">-- Chọn CH trước --</option>';
  document.getElementById('storeFilled').style.display='none';
  selectedStore=null;
  if(!m)return;
  let gdvs={};
  STORES.filter(s=>s.mien===m).forEach(s=>{
    let k=s.gdv||'Không rõ';
    if(!gdvs[k])gdvs[k]=0; gdvs[k]++;
  });
  Object.keys(gdvs).sort().forEach(g=>sel.innerHTML+=`<option value="${g}">${g} (${gdvs[g]} CH)</option>`);
}
function onGdvChange(){
  let m=document.getElementById('smien').value;
  let g=document.getElementById('sgdv').value;
  let sel=document.getElementById('sqlkv');
  sel.innerHTML='<option value="">-- Chọn QLKV --</option>';
  document.getElementById('sstore').innerHTML='<option value="">-- Chọn CH trước --</option>';
  document.getElementById('storeFilled').style.display='none';
  selectedStore=null;
  if(!g)return;
  let qlkvs={};
  STORES.filter(s=>s.mien===m&&s.gdv===g).forEach(s=>{
    let k=s.qlkv||'Không rõ';
    if(!qlkvs[k])qlkvs[k]=0; qlkvs[k]++;
  });
  Object.keys(qlkvs).sort().forEach(q=>sel.innerHTML+=`<option value="${q}">${q} (${qlkvs[q]} CH)</option>`);
}
function onQlkvChange(){
  let m=document.getElementById('smien').value;
  let g=document.getElementById('sgdv').value;
  let q=document.getElementById('sqlkv').value;
  let sel=document.getElementById('sstore');
  sel.innerHTML='<option value="">-- Chọn cửa hàng --</option>';
  document.getElementById('storeFilled').style.display='none';
  selectedStore=null;
  if(!q)return;
  STORES.filter(s=>s.mien===m&&s.gdv===g&&s.qlkv===q).sort((a,b)=>a.ma.localeCompare(b.ma,'vi')).forEach(s=>{
    sel.innerHTML+=`<option value="${s.ma}" data-ten="${s.ten}" data-gdv="${s.gdv}" data-qlkv="${s.qlkv}" data-tinh="${s.tinh}" data-mien="${s.mien}">${s.ma} - ${s.ten}</option>`;
  });
}
function onStoreChange(){
  let o=document.getElementById('sstore').selectedOptions[0];
  if(!o||!o.dataset.ten)return;
  selectedStore={ma:o.value,ten:o.dataset.ten,gdv:o.dataset.gdv,qlkv:o.dataset.qlkv,tinh:o.dataset.tinh,mien:o.dataset.mien};
  document.getElementById('sfMa').textContent=selectedStore.ma;
  document.getElementById('sfTen').textContent=selectedStore.ten;
  document.getElementById('sfGdv').textContent=selectedStore.gdv;
  document.getElementById('sfQlkv').textContent=selectedStore.qlkv;
  document.getElementById('sfTinh').textContent=selectedStore.tinh;
  document.getElementById('storeFilled').style.display='block';
}

// ===== SUBMIT =====
function submitSurvey(){
  if(!selectedStore)return showToast('Vui long chon cua hang','err');
  let meat=document.getElementById('smeat').value, veg=document.getElementById('sveg').value;
  let ngay=document.getElementById('sday').value;
  if(!meat){showToast('Vui long chon gio nhan Thit (hoac Khong co lich giao)','err');return;}
  if(!veg){showToast('Vui long chon gio nhan Rau (hoac Khong co lich giao)','err');return;}
  // Normalize "KHONGCO" to empty string for storage
  if(meat==='KHONGCO')meat='';
  if(veg==='KHONGCO')veg='';
  
  let d={ma:selectedStore.ma,ten:selectedStore.ten,gdv:selectedStore.gdv,tinh:selectedStore.tinh,qlkv:selectedStore.qlkv,mien:selectedStore.mien,ngay:ngay,meat:meat,veg:veg,ts:new Date().toISOString()};
  
  // Show confirmation card
  let html='<div style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center" id="confirmModal">';
  html+='<div style="background:#fff;border-radius:12px;padding:24px;max-width:400px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2)">';
  html+='<h3 style="margin:0 0 16px;color:#2e7d32">Xac nhan thong tin</h3>';
  html+='<table style="width:100%;font-size:13px;border-collapse:collapse">';
  html+='<tr><td style="padding:6px 0;color:#888;width:80px">Cua hang</td><td style="padding:6px 0;font-weight:600">'+d.ma+' - '+d.ten+'</td></tr>';
  html+='<tr><td style="padding:6px 0;color:#888">GDV</td><td style="padding:6px 0">'+d.gdv+'</td></tr>';
  html+='<tr><td style="padding:6px 0;color:#888">Ngay</td><td style="padding:6px 0;font-weight:600">'+d.ngay+'</td></tr>';
  html+='<tr><td style="padding:6px 0;color:#888">Thit MDL</td><td style="padding:6px 0;color:#c62828;font-weight:600">'+(d.meat||'Khong co')+'</td></tr>';
  html+='<tr><td style="padding:6px 0;color:#888">Rau-Trai cay</td><td style="padding:6px 0;color:#2e7d32;font-weight:600">'+(d.veg||'Khong co')+'</td></tr>';
  html+='</table>';
  html+='<div style="display:flex;gap:10px;margin-top:18px">';
  html+='<button onclick="doSubmitSurvey()" style="flex:1;padding:12px;background:#2e7d32;color:#fff;border:none;border-radius:6px;font-weight:600;cursor:pointer">Dong y gui</button>';
  html+='<button onclick="document.getElementById(\'confirmModal\').remove()" style="flex:1;padding:12px;background:#eee;color:#333;border:none;border-radius:6px;font-weight:600;cursor:pointer">Huy</button>';
  html+='</div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
  window._pendingSurvey=d;
}
function doSubmitSurvey(){
  let d=window._pendingSurvey;if(!d)return;
  document.getElementById('confirmModal').remove();
  
  SURVEYS.push(d);localStorage.setItem('ks_nhanhang',JSON.stringify(SURVEYS));
  let GAS_URL=localStorage.getItem('ctkm_gas_url')||'https://script.google.com/macros/s/AKfycbykaFmh6e3pUuWATtd3ZoMWssoy_lFgvaH7nEW-cZ1e0K_W1Wyes5DZpkzZRwoK8D04/exec';
  if(GAS_URL){fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'addNhanHang',data:d})}).catch(()=>{});}
  
  document.getElementById('smeat').value='';document.getElementById('sveg').value='';
  selectedStore=null;document.getElementById('storeFilled').style.display='none';
  document.getElementById('smien').value='';onMienChange();
  showToast('Da hoan thanh khao sat! Cam on ban.');
}

function showToast(msg,cls){
  let t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(cls?' '+cls:'');
  t.style.display='block';setTimeout(()=>t.style.display='none',2500);
}

// Check for dashboard redirect
if(location.search.includes('tab=1')){
  location.href='https://ruralwcm.github.io/ctkm-rural/khaosat-nhanhang.html#dash';
}
</script>
</body>
</html>
