<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTKM RURAL v2.37</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #333; }
    .header { background: #1F4E79; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .tabs { display: flex; background: white; border-bottom: 2px solid #e0e0e0; }
    .tab { padding: 12px 24px; cursor: pointer; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: #1F4E79; border-bottom-color: #1F4E79; }
    .content { padding: 20px; max-width: 1400px; margin: 0 auto; }
    
    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .stat-card .num { font-size: 28px; font-weight: 700; color: #1F4E79; }
    .stat-card .label { font-size: 12px; color: #666; margin-top: 4px; }
    .stat-card.active-card { box-shadow: 0 0 0 2px #1F4E79; transform: translateY(-1px); }
    
    /* Table */
    .table-wrap { background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f8f9fa; padding: 10px 8px; text-align: left; font-weight: 600; border-bottom: 2px solid #dee2e6; white-space: nowrap; }
    td { padding: 8px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f8f9ff; }
    .ct-row:hover { background: #eef2ff !important; }
    .ct-detail td { border-top: 2px solid #1F4E79; }
    
    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #555; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
    textarea { resize: vertical; min-height: 60px; }
    
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-primary { background: #1F4E79; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    
    .region-tags { display: flex; gap: 8px; }
    .region-tag { padding: 6px 16px; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; font-size: 12px; }
    .region-tag.active { background: #1F4E79; color: white; border-color: #1F4E79; }
    
    .filter-tag { padding: 3px 10px; border: 1px solid #ddd; border-radius: 14px; cursor: pointer; font-size: 11px; white-space: nowrap; user-select: none; transition: all .15s; }
    .filter-tag:hover { border-color: #1F4E79; background: #eef2ff; }
    .filter-tag.active { background: #1F4E79; color: white; border-color: #1F4E79; }
    
    /* Multi-select dropdown */
    .ms-wrap { position: relative; display: inline-block; flex-shrink: 0; }
    .ms-btn { padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 11px; cursor: pointer; background: white; white-space: nowrap; min-width: 110px; max-width: 160px; text-align: left; overflow: hidden; text-overflow: ellipsis; width: auto; }
    .ms-btn:hover { border-color: #1F4E79; }
    .ms-drop { display: none; position: absolute; top: 100%; left: 0; z-index: 9999; background: white; border: 1px solid #ddd; border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.15); max-height: 300px; overflow-y: auto; min-width: 200px; max-width: 320px; white-space: nowrap; }
    .ms-wrap.right .ms-drop { left: auto; right: 0; }
    .ms-drop.open { display: block; }
    .ms-item { padding: 5px 12px; cursor: pointer; font-size: 11px; white-space: nowrap; user-select: none; border-left: 3px solid transparent; }
    
    @media (max-width: 768px) {
      .ms-drop { min-width: 170px; max-width: 250px; max-height: 250px; font-size: 10px; }
      .ms-item { font-size: 10px; padding: 4px 10px; }
      .ms-btn { font-size: 10px; min-width: 90px; max-width: 130px; padding: 5px 6px; }
      /* table */
    }
    @media (max-width: 480px) {
      .ms-drop { min-width: 160px; max-width: calc(100vw - 24px); max-height: 220px; }
      .ms-item { font-size: 10px; padding: 3px 8px; }
      .ms-btn { font-size: 10px; min-width: 60px; max-width: 100px; padding: 5px 4px; }
    }
    .ms-item:hover { background: #f0f4ff; }
    .ms-item.selected { background: #dbeafe; color: #1F4E79; font-weight: 600; border-left-color: #1F4E79; }
    .ms-grp-hdr { padding: 4px 12px; font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; background: #f8f9fa; border-top: 1px solid #eee; }
    .ms-chips { display: inline-flex; gap: 3px; flex-wrap: wrap; vertical-align: middle; }
    .ms-chip { display: inline-flex; align-items: center; gap: 2px; background: #e8f0fe; color: #1F4E79; padding: 2px 6px; border-radius: 10px; font-size: 10px; }
    .ms-chip .x { cursor: pointer; font-weight: bold; margin-left: 2px; }
    
    .view-btn { padding: 5px 10px; border: 1px solid #ddd; border-radius: 14px; cursor: pointer; font-size: 11px; background: white; transition: all .15s; }
    .view-btn.active { background: #1F4E79; color: white; border-color: #1F4E79; }
    
    .toast { position: fixed; bottom: 20px; right: 20px; background: #28a745; color: white; padding: 12px 20px; border-radius: 4px; display: none; }
    .loading { text-align: center; padding: 40px; color: #999; }
    
    .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { width: auto; min-width: 150px; }
    
    /* Responsive */
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .header { padding: 12px 16px; }
      .header h1 { font-size: 16px; }
      .tab { padding: 10px 12px; font-size: 12px; }
      .content { padding: 12px; }
      .filter-bar { gap: 6px; }
      .filter-bar input, .filter-bar select { min-width: 100px; font-size: 12px; padding: 6px 8px; }
      table { font-size: 11px; }
      th, td { padding: 6px 4px; }
      .stat-card { padding: 12px; }
      .stat-card .num { font-size: 22px; }
      .btn { padding: 8px 14px; font-size: 12px; }
      .table-wrap { -webkit-overflow-scrolling: touch; }
    }
    @media (max-width: 768px) {
      .ms-btn { font-size: 10px !important; min-width: 70px !important; max-width: 110px !important; padding: 4px 6px !important; }
      .view-btn { font-size: 10px !important; padding: 4px 8px !important; }
    }
    @media (max-width: 480px) {
      .tabs { overflow-x: auto; white-space: nowrap; }
      .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
      .header h1 { font-size: 13px; }
      .header { padding: 8px 10px; }
      .filter-bar { flex-direction: column; gap: 6px; }
      .filter-bar input, .filter-bar select { width: 100%; min-width: auto; }
      .btn { width: 100%; font-size: 12px; padding: 8px 12px; }
      .ms-btn { font-size: 10px !important; min-width: 70px !important; max-width: 100px !important; padding: 5px 5px !important; }
      .view-btn { font-size: 10px !important; padding: 4px 6px !important; }
      .ms-drop { min-width: 140px !important; max-width: 180px !important; font-size: 10px; }
      /* Data tab mobile: compact filter row */
      .data-filters { display: flex; flex-wrap: wrap; gap: 4px; }
      .data-filters .ms-btn { min-width: 60px !important; max-width: 80px !important; font-size: 9px !important; padding: 4px 4px !important; }
      .data-filters input { font-size: 11px !important; padding: 5px 6px !important; }
      /* Table smaller on mobile */
      #dataTable table { font-size: 10px; }
      #dataTable th, #dataTable td { padding: 4px 3px; font-size: 9px; }
      #dataTable .ms-btn { font-size: 9px !important; min-width: 55px !important; max-width: 75px !important; }
    }
  </style>
</head>
<body>
<div class="header">
  <h1>🏷 CTKM RURAL <span style="font-size:11px;opacity:.7;font-weight:400" id="appVer">v2.37</span> <span style="font-size:11px;opacity:.6;font-weight:400;color:#ffd54f" id="dataDate">| Update: 06/10/2026</span></h1>
  <span id="userInfo"></span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('dashboard')">📊 Dashboard</div>
  <div class="tab" onclick="switchTab('data')">📋 Dữ liệu</div>
  <div class="tab" onclick="switchTab('add')">➕ Thêm CTKM</div>
  <div class="tab" onclick="switchTab('import')">📥 Import</div>
</div>

<div class="content" id="mainContent">
  <div class="loading">Đang tải dữ liệu...</div>
</div>
<div class="toast" id="toast"></div>

<script>
const APP_VERSION = "2.37";
let allData = [];
let groupedData = [];
let expandedCT = new Set();

function dayOnly(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['dashboard','data','add','import'][i] === tab);
  });
  if (tab === 'dashboard') renderDashboard();
  else if (tab === 'data') renderDataTable();
  else if (tab === 'add') { renderAddForm(); setTimeout(function(){ loadProvinceList(); }, 200); setTimeout(function(){ document.querySelectorAll('#regionTags .region-tag').forEach(function(t){t.classList.add('active')}); renderFilteredProvinces(); }, 300); }
  else if (tab === 'import') renderImport();
}

function showToast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = ok ? '#28a745' : '#dc3545';
  t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000);
}

// ============ DASHBOARD ============
function renderDashboard() {
  // Compute CT status
  const now = new Date();
  const next7d = new Date(now); next7d.setDate(next7d.getDate() + 7);
  const next30d = new Date(now); next30d.setDate(next30d.getDate() + 30);
  
  let totalSKU = 0, activeSKU = 0, upcomingSKU = 0, endingSKU = 0, expiredSKU = 0;
  let activeNow = [], upcoming = [], endingSoon = [], expired = [], allCT = [];
  const twoDaysLater = new Date(now); twoDaysLater.setDate(twoDaysLater.getDate() + 2);
  
  groupedData.forEach(ct => {
    totalSKU += ct[4] || 0;
    const ctInfo = {
      ma: ct[0]||'', ten: ct[1]||'', loai: ct[2]||'', nhom: ct[3]||'',
      sku: ct[4]||0, skuList: ct[5]||'',
      ngayBD: ct[6], ngayKT: ct[7],
      bac: ct[10]||0, trung: ct[11]||0, nam: ct[12]||0, tay: ct[13]||0
    };
    allCT.push(ctInfo);
    
    
    // Determine status (handle both Date objects and text strings)
    let bd = ct[6] ? new Date(ct[6]) : null;
    let kt = ct[7] ? new Date(ct[7]) : null;
    if (bd && isNaN(bd.getTime())) bd = null;
    if (kt && isNaN(kt.getTime())) kt = null;
    
    if (bd && kt) { var bdD=dayOnly(bd),ktD=dayOnly(kt),todayD=dayOnly(now); if (bdD <= todayD && ktD >= todayD) { activeNow.push(ctInfo); } if (ktD >= todayD && ktD <= dayOnly(twoDaysLater)) { endingSoon.push(ctInfo); } if (ktD < todayD) { expired.push(ctInfo); } }
    if (bd) { var bdD2=dayOnly(bd); if (bdD2 > todayD && bdD2 <= dayOnly(next30d)) { upcoming.push(ctInfo); } }
    else if (!bd || !kt) {
      // Text-based dates: check if text suggests ongoing
      const ktStr = (ct[7]||'').toString().toLowerCase();
      if (ktStr.includes('đến khi có tb') || ktStr.includes('31.12.2026') || ktStr.includes('31/12/2026') || ktStr.includes('31.12.26')) {
        activeNow.push(ctInfo);
      }
    }

  });
  
  var skuKeySet = new Set(); var ctWithKeySet = new Set();
  (window._skuData||[]).forEach(function(sku){ var key = sku.length>24&&sku[24]?sku[24]:null; if(key){ skuKeySet.add(key.toString()); ctWithKeySet.add((sku[1]||'').toString()); } });
  var skuKeyCount = skuKeySet.size + ' / ' + ctWithKeySet.size;
  document.getElementById('mainContent').innerHTML = `
    <div class="stats">
      <div class="stat-card" id="cardAll" onclick="quickFilter('all')" style="cursor:pointer;transition:all .15s" title="Lọc: Tất cả CTKM">
        <div class="num">${allCT.length}</div><div class="label">🔢 Tổng SKU</div>
      </div>
      <div class="stat-card" id="cardActive" onclick="quickFilter('active')" style="cursor:pointer;transition:all .15s;border-left:3px solid #28a745" title="Lọc: CTKM đang hiệu lực">
        <div class="num" style="color:#28a745">${activeNow.length}</div><div class="label">🟢 Đang hiệu lực</div>
      </div>
      <div class="stat-card" id="cardUpcoming" onclick="quickFilter('upcoming')" style="cursor:pointer;transition:all .15s;border-left:3px solid #F9A825" title="Lọc: CTKM sắp diễn ra">
        <div class="num" style="color:#F9A825">${upcoming.length}</div><div class="label">🟡 Sắp diễn ra</div>
      </div>
      <div class="stat-card" id="cardEnding" onclick="quickFilter('ending')" style="cursor:pointer;transition:all .15s;border-left:3px solid #dc2626" title="Lọc: CTKM sắp kết thúc (≤2 ngày)">
        <div class="num" style="color:#dc2626">${endingSoon.length}</div><div class="label">🔴 Sắp kết thúc</div>
      </div>
      <div class="stat-card" id="cardExpired" onclick="quickFilter('expired')" style="cursor:pointer;transition:all .15s;border-left:3px solid #94a3b8" title="Lọc: CTKM đã hết hạn">
        <div class="num" style="color:#94a3b8">${expired.length}</div><div class="label">⏹ Đã hết hạn</div>
      </div>
      <div class="stat-card" id="cardSKU" onclick="quickFilter('mch3')" style="cursor:pointer;transition:all .15s" title="Xem theo MCH3">
        <div class="num" style="font-size:22px">${skuKeyCount}</div><div class="label">🔑 SKU Key / CT có Key</div>
      </div>
    </div>
    
    <!-- BỘ LỌC DASHBOARD (View + Filter combined) -->
    <div style="background:white;border-radius:8px;padding:8px 12px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;gap:6px;align-items:center;">
      <button id="btnViewCTKM" class="view-btn active" onclick="switchView('CTKM')" style="flex-shrink:0">📋 CTKM</button>
      <button id="btnViewMCH3" class="view-btn" onclick="switchView('MCH3')" style="flex-shrink:0">🏷 MCH3</button>
      <span style="color:#cbd5e1;flex-shrink:0">|</span>
      <span style="font-weight:600;color:#1F4E79;font-size:12px;white-space:nowrap;flex-shrink:0">🔍</span>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap">
      
      <!-- Miền AD -->
      <div class="ms-wrap" id="msMien">
        <button class="ms-btn" data-title="Miền AD" onclick="toggleMS('msMien')">Miền AD ▾</button>
        <div class="ms-drop" id="msMienDrop">
          <div class="ms-item" data-val="bac" onclick=\"toggleMSItem(this,'msMien',event)\">BẮC</div>
          <div class="ms-item" data-val="trung" onclick=\"toggleMSItem(this,'msMien',event)\">TRUNG</div>
          <div class="ms-item" data-val="nam" onclick=\"toggleMSItem(this,'msMien',event)\">NAM</div>
          <div class="ms-item" data-val="tay" onclick=\"toggleMSItem(this,'msMien',event)\">TÂY</div>
        </div>
      </div>
      
      <!-- Phạm vi -->
      <div class="ms-wrap" id="msPhamVi">
        <button class="ms-btn" data-title="Phạm vi" onclick="toggleMS('msPhamVi')" style="min-width:95px">Phạm vi ▾</button>
        <div class="ms-drop" id="msPhamViDrop">
          <div class="ms-item" data-val="all" onclick="toggleMSItem(this,'msPhamVi',event)">🟢 All</div>
          <div class="ms-item" data-val="tinh" onclick="toggleMSItem(this,'msPhamVi',event)">🟠 Tỉnh</div>
          <div class="ms-item" data-val="store" onclick="toggleMSItem(this,'msPhamVi',event)">🔴 Store</div>
        </div>
      </div>
      
      <!-- Loại CTKM -->
      <div class="ms-wrap" id="msLoai">
        <button class="ms-btn" data-title="Loại CTKM" onclick="toggleMS('msLoai')">Loại CTKM ▾</button>
        <div class="ms-drop" id="msLoaiDrop">
          ${[...new Set(allCT.map(r=>r.loai))].filter(Boolean).sort().map(v=>`<div class="ms-item" data-val="${v}" onclick=\"toggleMSItem(this,'msLoai',event)\">${v}</div>`).join('')}
        </div>
      </div>
      
      <!-- Ngành MCH3 -->
      <div class="ms-wrap" id="msNhom">
        <button class="ms-btn" data-title="Ngành MCH3" onclick="toggleMS('msNhom')">Ngành MCH3 ▾</button>
        <div class="ms-drop" id="msNhomDrop">
          ${(()=>{
            const m = {'Fresh & Chill':['Thịt','Thịt nguội, xúc xích, hàng chua','Rau củ','Trái cây','Thủy hải sản','Bơ, sữa, trứng','Đông lạnh','Thức ăn nấu sẵn','Bánh mỳ'],'Ambient':['Thực phẩm khô','Bánh kẹo','Đồ uống, thuốc lá','Hóa phẩm','Mỹ phẩm, chăm sóc cá nhân','Gia dụng','Giấy và bông','Đồ dùng Dân dụng/Trang trí','Đồ chơi/Giải trí thể thao','Văn phòng phẩm','Phụ kiện','Bông Vải Sợi']};
            const nhomSet = [...new Set(allCT.map(r=>r.nhom))].filter(Boolean);
            const used = new Set();
            let h = '';
            for(const [g,items] of Object.entries(m)){
              const found = items.filter(i=>nhomSet.includes(i));
              if(!found.length) continue;
              h += `<div class="ms-grp-hdr">${g}</div>`;
              found.forEach(v=>{h+=`<div class="ms-item" data-val="${v}" onclick=\"toggleMSItem(this,'msNhom',event)\">${v}</div>`; used.add(v);});
            }
            nhomSet.filter(n=>!used.has(n)).forEach(v=>h+=`<div class="ms-item" data-val="${v}" onclick=\"toggleMSItem(this,'msNhom',event)\">${v}</div>`);
            return h;
          })()}
        </div>
      </div>
      
      <!-- SKU Key -->
      <div class="ms-wrap" id="msSkuKey">
        <button class="ms-btn" data-title="SKU Key" onclick="toggleMS('msSkuKey')">SKU Key ▾</button>
        <div class="ms-drop" id="msSkuKeyDrop">
          ${(()=>{
            const skus = window._skuData || [];
            // SKU Key at index 24 if exists, fallback to empty
            const keys = [...new Set(skus.map(r=>r.length>24&&r[24]?r[24]:null).filter(Boolean))].sort();
            if (!keys.length) return '<div class="ms-item" style="color:#999">Chưa có dữ liệu</div>';
            return keys.slice(0,200).map(v=>`<div class="ms-item" data-val="${v}" onclick="toggleMSItem(this,'msSkuKey',event)">${v}</div>`).join('');
          })()}
        </div>
      </div>
      
      <!-- Thời gian -->
      <select id="dashFilterTime2" onchange="onTimeFilterChange()" style="padding:5px 8px;border:1px solid #ddd;border-radius:4px;font-size:11px;width:130px;flex-shrink:0">
        <option value="">Thời gian hiệu lực</option>
        <option value="homNay">Hôm nay</option>
        <option value="7ngay">7 ngày tới</option>
        <option value="30ngay">30 ngày tới</option>
        <option value="thangNay">Tháng này</option>
        <option value="quyNay">Quý này</option>
        <option value="custom">📅 Khoảng ngày...</option>
      </select>
      <span id="customDateRange" style="display:none;gap:4px;align-items:center;flex-shrink:0">
        <input type="date" id="dateFrom" onchange="applyDashFilter()" style="padding:3px 3px;border:1px solid #ddd;border-radius:4px;font-size:9px;width:85px">
        <span style="font-size:10px;color:#888">→</span>
        <input type="date" id="dateTo" onchange="applyDashFilter()" style="padding:3px 3px;border:1px solid #ddd;border-radius:4px;font-size:9px;width:85px">
      </span>
      
      <span id="dashFilterCount" style="font-size:10px;color:#888;white-space:nowrap;margin-left:auto;flex-shrink:0"></span>
      </div>
    </div>
    
    <!-- Chip display for selected -->
    <div id="msChipsBar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;min-height:0"></div>
    
    <!-- VIEW: Theo CTKM — Unified table -->
    <div id="viewCTKM">
    <div class="table-wrap" id="ctkmUnifiedTable">${renderUnifiedCTTable(activeNow, upcoming, allCT)}</div>
    </div>
    
    <!-- VIEW: Theo MCH3 -->
    <div id="viewMCH3" style="display:none">
      
      <div class="table-wrap" id="mch3CTTable">${renderMCH3View(allCT)}</div>
    </div>
  `;
  // Store for filter
  window._allCT = allCT;
  window._activeNow = activeNow;
  window._upcoming = upcoming;
  window._endingSoon = endingSoon;
  window._expired = expired;
  window._allCT = allCT;
  window._cardCounts = {all:allCT.length, active:activeNow.length, upcoming:upcoming.length, ending:endingSoon.length, expired:expired.length, totalSKU:totalSKU}; window._skuCardCounts = computeSKUCardCounts(); window._currentView = 'CTKM';
  // Update card counts based on current filtered view
  
}

// ============ MULTI-SELECT DROPDOWN (click-to-select) ============
let activeMS = null;

function toggleMS(id) {
  const drop = document.getElementById(id + 'Drop');
  if (activeMS === id) { drop.classList.remove('open'); activeMS = null; return; }
  if (activeMS) document.getElementById(activeMS + 'Drop').classList.remove('open');
  drop.classList.add('open');
  activeMS = id;
}

document.addEventListener('click', e => {

function toggleMSItem(el, groupId, event) {

  if (ctrl) {
    if (!msSelectAllDone[groupId]) {
      // First ctrl+click: select ALL then deselect this one
      var wrap = document.getElementById(groupId);
      var allItems = wrap.querySelectorAll('.ms-item');
      allItems.forEach(function(item) { item.classList.add('selected'); });
      el.classList.remove('selected');
      msSelectAllDone[groupId] = true;
    } else {

function applyDashFilter() {
  // Guard: only run on Dashboard tab (skip if Data tab)
  if (!document.getElementById('dashFilterTime2')) return;
  const selLoai = new Set(getMSValues('msLoai'));
  const selNhom = new Set(getMSValues('msNhom'));
  const selMien = new Set(getMSValues('msMien'));
  const selPhamVi = new Set(getMSValues('msPhamVi'));
  const selStatus = new Set(getMSValues('msStatus')); if (!selStatus.size && window._cardFilter) selStatus.add(window._cardFilter);
  const selTime = document.getElementById('dashFilterTime2')?.value || '';
  
  const now = new Date();
  const in7d = new Date(now); in7d.setDate(in7d.getDate()+7);
  const in30d = new Date(now); in30d.setDate(in30d.getDate()+30);
  
  const filterFn = r => {
    if (selLoai.size > 0 && !selLoai.has(r.loai)) return false;
    if (selNhom.size > 0 && !selNhom.has(r.nhom)) return false;
    if (selMien.size > 0) {
      let ok = false;
      if (selMien.has('bac') && r.bac) ok = true;
      if (selMien.has('trung') && r.trung) ok = true;
      if (selMien.has('nam') && r.nam) ok = true;
      if (selMien.has('tay') && r.tay) ok = true;
      if (!ok) return false;
    }
    if (selPhamVi.size > 0) {
      var pv = window._phamVi && window._phamVi[(r.ma||'').toString()] ? window._phamVi[(r.ma||'').toString()] : 'all';
      if (!selPhamVi.has(pv)) return false;
    }
    const selSkuKey = new Set(getMSValues('msSkuKey'));
    if (selSkuKey.size > 0) {
      const skuData = window._skuData || [];
      const matchingCT = new Set();
      skuData.forEach(sku => {
        const key = sku.length > 24 ? (sku[24]||'') : (sku[4]||'');
        if (selSkuKey.has(key.toString())) {
          matchingCT.add((sku[1]||'').toString());
        }
      });
      if (!matchingCT.has(r.ten||'')) return false;
    }
    if (selStatus.size > 0) {
      const now2 = new Date(); const twoDays2 = new Date(now2); twoDays2.setDate(twoDays2.getDate()+2);
      let bdS = r.ngayBD ? new Date(r.ngayBD) : null; let ktS = r.ngayKT ? new Date(r.ngayKT) : null;
      if (bdS && isNaN(bdS.getTime())) bdS = null;
      if (ktS && isNaN(ktS.getTime())) ktS = null;
      if (!bdS || !ktS) return false;
      let bSD = dayOnly(bdS), kSD = dayOnly(ktS), n2D = dayOnly(now2), t2D = dayOnly(twoDays2);
      let okS = false;
      if (selStatus.has('active') && bSD <= n2D && kSD >= n2D) okS = true;
      if (selStatus.has('upcoming') && bSD > n2D) okS = true;
      if (selStatus.has('ending') && kSD >= n2D && kSD <= t2D) okS = true;
      if (selStatus.has('expired') && kSD < n2D) okS = true;
      if (!okS) return false;
    }
    if (selTime) {
      let bd = r.ngayBD ? new Date(r.ngayBD) : null;
      if (bd && isNaN(bd.getTime())) bd = null;
      if (!bd) return false;
      if (selTime === 'homNay') { if (!(bd <= now && r.ngayKT && new Date(r.ngayKT) >= now)) return false; }
      else if (selTime === '7ngay') { if (bd > in7d) return false; }
      else if (selTime === '30ngay') { if (bd > in30d) return false; }
      else if (selTime === 'thangNay') { if (bd.getMonth()!==now.getMonth()||bd.getFullYear()!==now.getFullYear()) return false; }
      else if (selTime === 'quyNay') { if (Math.floor(bd.getMonth()/3)!==Math.floor(now.getMonth()/3)||bd.getFullYear()!==now.getFullYear()) return false; }
      else if (selTime === 'custom') {
        const df = document.getElementById('dateFrom')?.value;
        const dt = document.getElementById('dateTo')?.value;
        if (df && bd < new Date(df)) return false;
        if (dt) { const kt = r.ngayKT ? new Date(r.ngayKT) : null; if (kt && !isNaN(kt) && kt > new Date(dt)) return false; }
      }
    }
    return true;
  };
  
  const filteredActive = (window._activeNow||[]).filter(filterFn);
  const filteredUpcoming = (window._upcoming||[]).filter(filterFn);
  const filteredAll = (window._allCT||[]).filter(filterFn);
  
  // Update unified CTKM table
  var ut = document.getElementById('ctkmUnifiedTable');
  if (ut) ut.innerHTML = renderUnifiedCTTable(filteredActive, filteredUpcoming, filteredAll);
  
  window._filteredAll = filteredAll; window._filteredActive = filteredActive; window._filteredUpcoming = filteredUpcoming; window._filteredEnding = (window._endingSoon||[]).filter(filterFn); window._filteredExpired = (window._expired||[]).filter(filterFn); document.getElementById('dashFilterCount').textContent = filteredAll.length + ' CT'; updateCardNums();
  
  if (window._currentView === 'MCH3') {
    var fsku = getFilteredSKU(window._skuData||[]); window._filteredSKU = fsku; document.getElementById('mch3CTTable').innerHTML = renderMCH3View(window._skuData||[]); updateCardNums();
  }
}

function refreshAllCT() {
  // Re-render all CT with sort
  const sortBy = document.getElementById('sortBy')?.value || 'ten';
  fetch(GAS_URL + '?action=getSKUData').then(r=>r.json()).then(skuData=>{
    // Build pricing per CT
    const ctPrice = {};
    skuData.forEach(row => {
      const ctName = (row[1]||'').toString();
      if (!ctName) return;
      if (!ctPrice[ctName]) ctPrice[ctName] = { prices: [], kmPrices: [], dienGiais: [] };
      const p = parseFloat(row[8]); // Giá thường (col 9)
      const km = parseFloat(row[9]); // Giá KM (col 10)
      const dg = (row[7]||'').toString(); // Diễn giải
      if (!isNaN(p)) ctPrice[ctName].prices.push(p);
      if (!isNaN(km)) ctPrice[ctName].kmPrices.push(km);
      if (dg) ctPrice[ctName].dienGiais.push(dg);
    });
    
    // Build enriched CT list
    const enriched = allCT_cts.map(ct => {
      const pData = ctPrice[ct.ten] || {};
      const avgPrice = pData.prices?.length ? pData.prices.reduce((a,b)=>a+b,0)/pData.prices.length : 0;
      const avgKM = pData.kmPrices?.length ? pData.kmPrices.reduce((a,b)=>a+b,0)/pData.kmPrices.length : 0;
      const pctKM = avgPrice > 0 ? ((avgPrice-avgKM)/avgPrice*100) : 0;
      return { ...ct, avgPrice, avgKM, pctKM, dienGiai: (pData.dienGiais||[]).join('; ').substring(0,60) };
    });
    
    // Sort
    if (sortBy === 'nhom') enriched.sort((a,b) => (a.nhom||'').localeCompare(b.nhom||''));
    else if (sortBy === 'gia') enriched.sort((a,b) => (b.avgPrice||0) - (a.avgPrice||0));
    else if (sortBy === 'giaKM') enriched.sort((a,b) => (b.avgKM||0) - (a.avgKM||0));
    else if (sortBy === 'pctKM') enriched.sort((a,b) => (b.pctKM||0) - (a.pctKM||0));
    else if (sortBy === 'dienGiai') enriched.sort((a,b) => (a.dienGiai||'').localeCompare(b.dienGiai||''));
    else enriched.sort((a,b) => (a.ten||'').localeCompare(b.ten||''));
    
    document.getElementById('allCTTable').innerHTML = renderCTTable(enriched);
  });
}

function renderMCH3View(data) {
  // SKU-centric view: apply filters + group by Nhóm hàng (MCH3), show SKUs directly
  const skuData = getFilteredSKU(window._skuData || []);
  
  // Build a map of nhom → SKUs

  skuData.forEach(row => {
    const nhom = (row[3]||'Khác').toString();
    if (!groups[nhom]) groups[nhom] = [];
    groups[nhom].push(row);
  });
  const sortedGroups = Object.keys(groups).sort();
  
  // Apply MCH3 filter if any
  const selNhom = new Set(getMSValues('msNhom'));
  
  // Helper: derive Miền AD string from B/T/N/T flags (indices 17-20)
  function mienAD(sku) {
    const parts = [];
    if (sku[17]) parts.push('B');
    if (sku[18]) parts.push('T');
    if (sku[19]) parts.push('N');
    if (sku[20]) parts.push('Ty');
    if (parts.length === 4) return 'ALL';
    return parts.length ? parts.join('/') : '';
  }

  return `<table style="table-layout:fixed;width:100%;min-width:800px">
    <colgroup>
      <col style="width:24px"><col style="width:55px"><col style="width:auto"><col style="width:30px">

      });

      if (selMien.has('nam') && sku[19]) ok = true;
      if (selMien.has('tay') && sku[20]) ok = true;
      if (!ok) return false;
    }
    if (selTime) {
      let bd = sku[12] ? new Date(sku[12]) : null;
      if (bd && isNaN(bd.getTime())) bd = null;
      if (!bd) return false;
      let kt = sku[13] ? new Date(sku[13]) : null;
      if (kt && isNaN(kt.getTime())) kt = null;

      else if (selTime === '7ngay') { if (bd>in7d) return false; }
      else if (selTime === '30ngay') { if (bd>in30d) return false; }
      else if (selTime === 'thangNay') { if (bd.getMonth()!==now.getMonth()||bd.getFullYear()!==now.getFullYear()) return false; }

function computeSKUCardCounts() {
  var skuData = window._skuData || [];
  var now = new Date(); var todayD = dayOnly(now);
  var twoDaysLater = new Date(now); twoDaysLater.setDate(twoDaysLater.getDate()+2); var twoDD = dayOnly(twoDaysLater);
  var next30d = new Date(now); next30d.setDate(next30d.getDate()+30); var d30D = dayOnly(next30d);
  var active = 0, upcoming = 0, ending = 0, expired = 0;
  skuData.forEach(function(sku) {
    var bd = sku[12] ? new Date(sku[12]) : null; if (bd && isNaN(bd.getTime())) bd = null;
    var kt = sku[13] ? new Date(sku[13]) : null; if (kt && isNaN(kt.getTime())) kt = null;
    if (bd && kt) { var bDD=dayOnly(bd), kDD=dayOnly(kt); if (bDD<=todayD && kDD>=todayD) active++; if (kDD>=todayD && kDD<=twoDD) ending++; if (kDD<todayD) expired++; }
    if (bd) { var bDD2=dayOnly(bd); if (bDD2>todayD && bDD2<=d30D) upcoming++; }
  });
  return {all:skuData.length, active:active, upcoming:upcoming, ending:ending, expired:expired, totalSKU:skuData.length};
}

let skuStoreMap = null;
function filterSKU() {
  const sku = (document.getElementById('filterSKU')?.value || '').trim().toLowerCase();
  if (!sku) { skuStoreMap = null; return filterTable(); }
  if (!skuStoreMap) {
    fetch(GAS_URL + '?action=getSKUData')
      .then(r => r.json())
      .then(skuData => {
        skuStoreMap = {};
        skuData.forEach(row => {
          const code = (row[4] || '').toString().toLowerCase();
          const ctName = (row[1] || '').toString();
          if (code && ctName) {
            if (!skuStoreMap[code]) skuStoreMap[code] = new Set();
            skuStoreMap[code].add(ctName);
          }
        });
        doSKUFilter();
      });
  } else { doSKUFilter(); }
}
function doSKUFilter() {
  const sku = (document.getElementById('filterSKU')?.value || '').trim().toLowerCase();
  let matched = new Set();
  if (sku && skuStoreMap) {
    Object.keys(skuStoreMap).forEach(code => {
      if (code.includes(sku)) skuStoreMap[code].forEach(ct => matched.add(ct));
    });
  }
  filterTable(matched.size > 0 ? matched : null);
}

// Export CSV
function exportDataCSV() {
  var skuData = window._skuData || [];
  var selLoai = new Set(getMSValues('msLoaiD'));
  var selNhom = new Set(getMSValues('msNhomD'));
  var selMien = new Set(getMSValues('msMienD'));
  var selPhamVi = new Set(getMSValues('msPhamViD'));
  var search = (document.getElementById('filterSearch')?.value || '').toLowerCase();
  
  var selSkuKey = new Set(getMSValues('msSkuKeyD'));
  
  var filtered = skuData.filter(function(r) {
    var rowStr = Object.values(r).join(' ').toLowerCase();
    if (search && !rowStr.includes(search)) return false;
    if (selLoai.size > 0 && !selLoai.has(r[2])) return false;
    if (selSkuKey.size > 0) {
      var key = r.length > 24 ? (r[24]||'') : '';
      if (!selSkuKey.has(key.toString())) return false;
    }
    if (selNhom.size > 0 && !selNhom.has(r[3])) return false;
    if (selMien.size > 0) {
      var ok = false;
      if (selMien.has('bac') && r[17]) ok = true;
      if (selMien.has('trung') && r[18]) ok = true;
      if (selMien.has('nam') && r[19]) ok = true;
      if (selMien.has('tay') && r[20]) ok = true;
      if (!ok) return false;
    }
    // Phạm vi filter
    if (selPhamVi.size > 0) {
      var pv = window._phamVi && window._phamVi[(r[0]||'').toString()] ? window._phamVi[(r[0]||'').toString()] : 'all';
      if (!selPhamVi.has(pv)) return false;
    }
    return true;
  });
  
  var csv = 'Mã CT,Tên CTKM,Phân loại,Nhóm hàng,Mã hàng,Tên hàng,ĐVT,Diễn giải,Giá thường,Giá KM,Ngày BĐ,Ngày KT,Miền\n';
  filtered.forEach(function(r) {
    var mien = [];
    if (r[17]) mien.push('BẮC');
    if (r[18]) mien.push('TRUNG');
    if (r[19]) mien.push('NAM');
    if (r[20]) mien.push('TÂY');
    var pvLabel = window._phamVi&&window._phamVi[(r[0]||'').toString()]?window._phamVi[(r[0]||'').toString()]:'all';
  csv += '"'+(r[0]||'')+'","'+(r[1]||'')+'","'+pvLabel+'","'+(r[2]||'')+'","'+(r[3]||'')+'","'+(r[4]||'')+'","'+(r[5]||'')+'","'+(r[6]||'')+'","'+(r[7]||'').replace(/"/g,'""')+'","'+(r[8]||'')+'","'+(r[9]||'')+'","'+fmtDate(r[12])+'","'+fmtDate(r[13])+'","'+mien.join('; ')+'"\n';
  });
  
  var blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'CTKM_Rural_Data_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  showToast('✅ Đã export ' + filtered.length + ' dòng');
}

// Override loadProvinceList to use simpler version
var ALL_PROVINCES = [];
var PROVINCE_BY_REGION = {bac:[], trung:[], nam:[], tay:[]};

function loadProvinceList() {
  var url = 'https://docs.google.com/spreadsheets/d/1fMmEm1GC9aei_3oeu2vcadPVsUM9ms9eVhm99d7pF8A/gviz/tq?sheet=Store_list&tqx=out:json&headers=1';
  fetch(url).then(function(r){return r.text()}).then(function(txt){
    var json = JSON.parse(txt.substring(txt.indexOf('{'),txt.lastIndexOf('}')+1));
    if (!json.table) return;
    var cols = json.table.cols.map(function(c){return (c.label||'').toLowerCase()});
    var tinhIdx = -1, mienIdx = -1;
    cols.forEach(function(h,i){ 
      if(h.includes('tỉnh')||h.includes('tinh')) tinhIdx=i;
      if(h.includes('miền')||h.includes('mien')) mienIdx=i;
    });
    var seen = new Set();
    (json.table.rows||[]).forEach(function(r){ 
      var t = ((r.c[tinhIdx>=0?tinhIdx:4]||{}).v||'').toString().trim();
      var m = mienIdx>=0 ? ((r.c[mienIdx]||{}).v||'').toString().toLowerCase() : '';
      if(!t || seen.has(t)) return; seen.add(t);
      ALL_PROVINCES.push({name:t, mien:m});
      // Map to region
      if(m.includes('bắc')||m.includes('north')) PROVINCE_BY_REGION.bac.push(t);
      else if(m.includes('trung')||m.includes('central')) PROVINCE_BY_REGION.trung.push(t);
      else if(m.includes('nam')||m.includes('south')) PROVINCE_BY_REGION.nam.push(t);
      else if(m.includes('tây')||m.includes('west')) PROVINCE_BY_REGION.tay.push(t);
    });
    // If region column not available, use hardcoded mapping
    if (PROVINCE_BY_REGION.bac.length === 0) {
      ALL_PROVINCES.forEach(function(p){
        var n = p.name;
        if (/Hà Nội|Hải Phòng|Quảng Ninh|Bắc Ninh|Hưng Yên|Hải Dương|Vĩnh Phúc|Phú Thọ|Thái Nguyên|Bắc Giang|Lạng Sơn|Cao Bằng|Bắc Kạn|Tuyên Quang|Hà Giang|Lào Cai|Yên Bái|Sơn La|Điện Biên|Hòa Bình|Thái Bình|Nam Định|Hà Nam|Ninh Bình|Thanh Hóa|Nghệ An|Hà Tĩnh/.test(n)) PROVINCE_BY_REGION.bac.push(n);
        else if (/Quảng Bình|Quảng Trị|Huế|Đà Nẵng|Quảng Nam|Quảng Ngãi|Bình Định|Phú Yên|Khánh Hòa|Ninh Thuận|Bình Thuận|Đắk Lắk|Đắk Nông|Gia Lai|Kon Tum|Lâm Đồng/.test(n)) PROVINCE_BY_REGION.trung.push(n);
        else if (/Hồ Chí Minh|Bà Rịa|Bình Dương|Bình Phước|Đồng Nai|Tây Ninh/.test(n)) PROVINCE_BY_REGION.nam.push(n);
        else if (/Long An|Tiền Giang|Bến Tre|Trà Vinh|Vĩnh Long|Đồng Tháp|An Giang|Kiên Giang|Cần Thơ|Hậu Giang|Sóc Trăng|Bạc Liêu|Cà Mau/.test(n)) PROVINCE_BY_REGION.tay.push(n);
        else PROVINCE_BY_REGION.nam.push(n); // default to Nam
      });
    }
    ALL_PROVINCES.sort(function(a,b){ return a.name.localeCompare(b.name,'vi'); });
    renderFilteredProvinces();
  }).catch(function(){});
}

function parseStoreInput() {
  var raw = document.getElementById('nhomStore').value;
  var result = document.getElementById('storeParseResult');
  var box = document.getElementById('siteChips');
  if (!box) {
    // Create chips container after the textarea
    var ta = document.getElementById('nhomStore');
    box = document.createElement('div');
    box.id = 'siteChips';
    box.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:0';
    ta.parentNode.insertBefore(box, ta.nextSibling);
  }
  if (!raw.trim()) { result.style.display='none'; box.innerHTML=''; return; }
  // Parse store codes
  var codes = raw.split(/[^a-zA-Z0-9]+/).filter(function(s){ return s.trim().length>0; });
  // Remove duplicates
  var unique = []; var seen = new Set();
  codes.forEach(function(c){ c=c.trim().toUpperCase(); if(!seen.has(c)){seen.add(c);unique.push(c);} });
  
  result.style.display='block';
  result.textContent = '✅ ' + unique.length + ' mã CH';
  document.getElementById('nhomStore').dataset.parsed = JSON.stringify(unique);
  
  // Render chips
  box.innerHTML = unique.map(function(c, i){
    return '<span style="display:inline-flex;align-items:center;gap:2px;background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:12px;font-size:11px;border:1px solid #c8e6c9">'
      + c + '<span onclick="removeSiteChip('+i+')" style="cursor:pointer;font-weight:bold;margin-left:2px;color:#c62828">&times;</span></span>';
  }).join('');
}

function removeSiteChip(idx) {
  var unique = JSON.parse(document.getElementById('nhomStore').dataset.parsed || '[]');
  unique.splice(idx, 1);
  document.getElementById('nhomStore').dataset.parsed = JSON.stringify(unique);
  document.getElementById('nhomStore').value = unique.join(', ');
  parseStoreInput();
}

function getProvinceCheckboxes(boxId) {

// Expected columns for validation
var IMPORT_COLS = ['Mã CT','Tên CTKM','Phân loại MH','Nhóm hàng (MCH3)','Mã hàng','Tên hàng','ĐVT','Diễn giải KM','Giá thường','Giá KM','Ngày HL Giá mua','Ngày KT Giá mua','Ngày BĐ KM','Ngày KT KM','Tỉnh áp dụng','Nhóm Store','Tỉnh loại trừ','BẮC','TRUNG','NAM','TÂY','Miền gốc'];
var importData = null;

function previewImport() {
  var file = document.getElementById('importFile').files[0];
  if (!file) return;
  
  document.getElementById('importStatus').innerHTML = '⏳ Đang đọc file...';
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    // Remove BOM
    if (text.charCodeAt(0) === 0xFEFF) text = text.substring(1);
    
    // Parse CSV
    var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
    if (lines.length < 2) {
      document.getElementById('importStatus').innerHTML = '❌ File rỗng hoặc chỉ có header';
      return;
    }
    
    // Parse header
    var headers = parseCSVLine(lines[0]);
    
    // Validate headers
    var missing = [];
    IMPORT_COLS.forEach(function(c, i) {
      if (!headers[i] || headers[i].trim().toLowerCase() !== c.toLowerCase()) {
        missing.push('Cột '+(i+1)+': mong đợi "'+c+'" nhưng nhận "'+(headers[i]||'')+'"');
      }
    });
    
    if (missing.length > 0) {
      document.getElementById('importStatus').innerHTML = '❌ <b>Header không khớp:</b><br>' + missing.slice(0,5).join('<br>') + (missing.length>5?'<br>...và '+(missing.length-5)+' lỗi khác':'');
      return;
    }
    
    // Parse data rows
    importData = [];
    for (var i = 1; i < lines.length; i++) {
      var row = parseCSVLine(lines[i]);
      if (row.length >= IMPORT_COLS.length) {
        importData.push(row.slice(0, IMPORT_COLS.length));
      }
    }
    
    if (importData.length === 0) {
      document.getElementById('importStatus').innerHTML = '❌ Không có dòng dữ liệu nào';
      return;
    }
    
    // Show preview
    document.getElementById('importStatus').innerHTML = '';
    document.getElementById('importPreview').style.display = 'block';
    document.getElementById('importSummary').innerHTML = '✅ <b>' + importData.length + ' dòng</b> hợp lệ. ' + IMPORT_COLS.length + ' cột khớp template.<br>📋 Xem trước 5 dòng đầu:';
    
    // Render preview table
    var tblHtml = '<table style="width:100%;font-size:11px"><tr style="background:#f0f0f0">';
    IMPORT_COLS.forEach(function(c){ tblHtml += '<th style="padding:4px 6px;font-size:10px">'+c+'</th>'; });
    tblHtml += '</tr>';
    var preview = importData.slice(0, 5);
    preview.forEach(function(row){
      tblHtml += '<tr>';
      row.forEach(function(cell){ tblHtml += '<td style="padding:3px 6px;font-size:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(cell||'').substring(0,40)+'</td>'; });
      tblHtml += '</tr>';
    });
    if (importData.length > 5) tblHtml += '<tr><td colspan="'+IMPORT_COLS.length+'" style="text-align:center;color:#888;padding:6px">... và '+(importData.length-5)+' dòng nữa</td></tr>';
    tblHtml += '</table>';
    document.getElementById('importTable').innerHTML = tblHtml;
  };
  reader.readAsText(file);
}

function parseCSVLine(line) {
  var result = [];
  var current = '';
  var inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"' && !inQuotes) { inQuotes = true; }
    else if (ch === '"' && inQuotes && i+1 < line.length && line[i+1] === '"') { current += '"'; i++; }
    else if (ch === '"' && inQuotes) { inQuotes = false; }
    else if (ch === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
    else { current += ch; }
  }
  result.push(current.trim());
  return result;
}

function confirmImport() {
  if (!importData || !importData.length) return showToast('Chưa có dữ liệu để import', false);
  
  document.getElementById('importStatus').innerHTML = '⏳ Đang gửi ' + importData.length + ' dòng lên GSheet...';
  
  fetch(GAS_URL, {
    method: 'POST',
    headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({action:'batchImport', data:importData})
  })
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if (resp.success || resp.ok) {
      document.getElementById('importStatus').innerHTML = '✅ <b>Import thành công!</b> ' + importData.length + ' dòng đã được đẩy lên GSheet.<br>🔄 Web app sẽ tự load data mới sau khi F5.';
      document.getElementById('importPreview').style.display = 'none';
      importData = null;
    } else {
      document.getElementById('importStatus').innerHTML = '❌ Lỗi: ' + (resp.message || JSON.stringify(resp));
    }
  })
  .catch(function(err){
    document.getElementById('importStatus').innerHTML = '❌ Lỗi kết nối GAS: ' + err.message + '<br><small>Thử lại hoặc kiểm tra GAS deployment</small>';
  });
}

function cancelImport() {
  importData = null;
  document.getElementById('importPreview').style.display = 'none';
  document.getElementById('importFile').value = '';
  document.getElementById('importStatus').innerHTML = '';
}

function fmtDate(v) { if (!v) return ""; const d = new Date(v); if (isNaN(d.getTime())) return v; return d.toLocaleDateString("vi-VN"); }

// Init — fallback chain: GitHub JSON → GAS API
const GAS_URL = localStorage.getItem('ctkm_gas_url') || 'https://script.google.com/macros/s/AKfycbykaFmh6e3pUuWATtd3ZoMWssoy_lFgvaH7nEW-cZ1e0K_W1Wyes5DZpkzZRwoK8D04/exec';

async function loadData() {
  const ts = Date.now();
  document.getElementById('mainContent').innerHTML = '<p style="padding:40px;text-align:center;color:#1F4E79">⏳ Đang tải dữ liệu...</p>';
  
  // Step 1: Try GitHub Pages static JSON
  try {
    const [grouped, sku] = await Promise.all([
      fetch('https://raw.githubusercontent.com/Ruralwcm/ctkm-rural/main/ctkm_grouped.json?_='+ts).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),
      fetch('https://raw.githubusercontent.com/Ruralwcm/ctkm-rural/main/ctkm_sku.json?_='+ts).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    ]);
    console.log('✅ Data loaded from GitHub Pages');
    return {grouped, sku};
  } catch(ghErr) {
    console.warn('⚠️ GitHub Pages:', ghErr.message, '→ trying GAS API');
    document.getElementById('mainContent').innerHTML = '<p style="padding:40px;text-align:center;color:#F9A825">⏳ Đang tải từ Google Sheets...</p>';
  }
  
  // Step 2: Fallback to GAS API
  if (GAS_URL) {
    try {
      const [grouped, sku] = await Promise.all([
        fetch(GAS_URL + '?action=getGroupedData&_='+ts).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}),
        fetch(GAS_URL + '?action=getSKUData&_='+ts).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      ]);
      console.log('✅ Data loaded from GAS API');
      return {grouped, sku};
    } catch(gasErr) {
      console.error('❌ GAS API:', gasErr.message);
    }
  }
  throw new Error('Không thể tải dữ liệu từ cả 2 nguồn');
}

loadData().then(({grouped, sku}) => {
  // Deduplicate grouped CTKM data by Mã CT (column 0)
  const seen = new Set();
  const deduped = grouped.filter(ct => {
    const key = (ct[0]||'').toString();
    if (seen.has(key)) return false;
    seen.add(key); return true;
  });
  groupedData = deduped;
  window._skuData = sku;
  // Compute Phạm vi for each CTKM from SKU data
  window._phamVi = computePhamVi(sku);
  // Attach phamVi to each grouped CT
  groupedData.forEach(function(ct) {
    ct[14] = window._phamVi[(ct[0]||'').toString()] || 'all';
  });
  try {
    renderDashboard();
    // Default view: MCH3
    setTimeout(function(){ switchView('MCH3'); }, 100);
  } catch(re) {
    console.error('renderDashboard crashed:', re);
    document.getElementById('mainContent').innerHTML = '<p style="padding:40px;text-align:center;color:#dc3545">❌ Lỗi render: ' + re.message + '</p>';
  }
}).catch(e => {
  console.error(e);
  document.getElementById('mainContent').innerHTML = '<p style="padding:40px;text-align:center;color:#dc3545;font-size:14px">❌ Không tải được dữ liệu<br><small style="color:#888">Thử: (1) F5 cứng Ctrl+Shift+R (2) Mở Console F12 xem lỗi<br>Nếu vẫn lỗi → kiểm tra GAS URL trong localStorage: ctkm_gas_url</small><br><br><button onclick="location.reload(true)" style="padding:8px 20px;background:#1F4E79;color:white;border:none;border-radius:4px;cursor:pointer;font-size:13px">🔄 Thử lại</button></p>';
  // Save GAS_URL to localStorage for next time
  if (GAS_URL) localStorage.setItem('ctkm_gas_url', GAS_URL);
});

// ============ PHẠM VI (All / Tỉnh / Store) ============
function computePhamVi(skuData) {
  // For each CTKM ID, determine scope category:
  //   "all"   = Full miền, NO tỉnh áp dụng cụ thể, NO loại trừ, NO nhóm store
  //   "tinh"  = Có tỉnh áp dụng cụ thể hoặc có loại trừ (nhưng ko có Nhóm Store)
  //   "store" = Có Nhóm Store / DS CH riêng (Adhoc)
  var map = {}; // { ctId: { phamVi, tinhApDung: [], tinhLoaiTru: [], nhomStore: [] } }
  skuData.forEach(function(r) {
    var ctId = (r[0]||'').toString();
    if (!map[ctId]) {
      map[ctId] = { tinhApDung: new Set(), tinhLoaiTru: new Set(), nhomStore: new Set() };
    }
    var ta = r[14]; if (ta && ta.toString().trim() && ta.toString().trim().toLowerCase() !== 'none') map[ctId].tinhApDung.add(ta.toString().trim());
    var ns = r[15]; if (ns && ns.toString().trim() && ns.toString().trim().toLowerCase() !== 'none') map[ctId].nhomStore.add(ns.toString().trim());
    var lt = r[16]; if (lt && lt.toString().trim() && lt.toString().trim().toLowerCase() !== 'none') map[ctId].tinhLoaiTru.add(lt.toString().trim());
  });
  
  var result = {};
  Object.keys(map).forEach(function(ctId) {
    var f = map[ctId];
    if (f.nhomStore.size > 0) {
      result[ctId] = 'store';
    } else if (f.tinhApDung.size > 0 || f.tinhLoaiTru.size > 0) {
      result[ctId] = 'tinh';
    } else {
      result[ctId] = 'all';
    }
  });
  return result;
}

function getPhamViBadge(phamVi) {
  if (phamVi === 'all') return '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:#dcfce7;color:#16a34a;white-space:nowrap">🟢 All</span>';
  if (phamVi === 'tinh') return '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:#fef3c7;color:#d97706;white-space:nowrap">🟠 Tỉnh</span>';
  if (phamVi === 'store') return '<span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600;background:#fce4ec;color:#dc2626;white-space:nowrap">🔴 Store</span>';
  return '';
}
