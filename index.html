<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTKM RURAL v1.5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #333; }
    .header { background: #1F4E79; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; }
    .tabs { display: flex; background: white; border-bottom: 2px solid #e0e0e0; }
    .tab { padding: 12px 24px; cursor: pointer; font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.active { color: #1F4E79; border-bottom-color: #1F4E79; }
    .content { padding: 20px; max-width: 1400px; margin: 0 auto; }
    
    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: white; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .stat-card .num { font-size: 28px; font-weight: 700; color: #1F4E79; }
    .stat-card .label { font-size: 12px; color: #666; margin-top: 4px; }
    
    /* Table */
    .table-wrap { background: white; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f8f9fa; padding: 10px 8px; text-align: left; font-weight: 600; border-bottom: 2px solid #dee2e6; white-space: nowrap; position: sticky; top: 0; }
    td { padding: 8px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f8f9ff; }
    
    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid .full { grid-column: 1 / -1; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #555; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
    textarea { resize: vertical; min-height: 60px; }
    
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
    .btn-primary { background: #1F4E79; color: white; }
    .btn-success { background: #28a745; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    
    .region-tags { display: flex; gap: 8px; }
    .region-tag { padding: 6px 16px; border: 1px solid #ddd; border-radius: 20px; cursor: pointer; font-size: 12px; }
    .region-tag.active { background: #1F4E79; color: white; border-color: #1F4E79; }
    
    .filter-tag { padding: 3px 10px; border: 1px solid #ddd; border-radius: 14px; cursor: pointer; font-size: 11px; white-space: nowrap; user-select: none; transition: all .15s; }
    .filter-tag:hover { border-color: #1F4E79; background: #eef2ff; }
    .filter-tag.active { background: #1F4E79; color: white; border-color: #1F4E79; }
    
    .toast { position: fixed; bottom: 20px; right: 20px; background: #28a745; color: white; padding: 12px 20px; border-radius: 4px; display: none; }
    .loading { text-align: center; padding: 40px; color: #999; }
    
    .filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { width: auto; min-width: 150px; }
    
    /* Responsive */
    @media (max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr; }
      .header { padding: 12px 16px; }
      .header h1 { font-size: 16px; }
      .tab { padding: 10px 12px; font-size: 12px; }
      .content { padding: 12px; }
      .filter-bar { gap: 6px; }
      .filter-bar input, .filter-bar select { min-width: 100px; font-size: 12px; padding: 6px 8px; }
      table { font-size: 11px; }
      th, td { padding: 6px 4px; }
      .stat-card { padding: 12px; }
      .stat-card .num { font-size: 22px; }
      .btn { padding: 8px 14px; font-size: 12px; }
      .table-wrap { -webkit-overflow-scrolling: touch; }
    }
    @media (max-width: 480px) {
      .tabs { overflow-x: auto; white-space: nowrap; }
      .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
      .header h1 { font-size: 14px; }
      .filter-bar { flex-direction: column; gap: 4px; }
      .filter-bar input, .filter-bar select { width: 100%; min-width: auto; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
<div class="header">
  <h1>🏷 CTKM RURAL</h1>
  <span id="userInfo"></span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('dashboard')">📊 Dashboard</div>
  <div class="tab" onclick="switchTab('data')">📋 Dữ liệu</div>
  <div class="tab" onclick="switchTab('add')">➕ Thêm CTKM</div>
  <div class="tab" onclick="switchTab('import')">📥 Import</div>
</div>

<div class="content" id="mainContent">
  <div class="loading">Đang tải dữ liệu...</div>
</div>
<div class="toast" id="toast"></div>

<script>
let allData = [];
let groupedData = [];

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['dashboard','data','add','import'][i] === tab);
  });
  if (tab === 'dashboard') renderDashboard();
  else if (tab === 'data') renderDataTable();
  else if (tab === 'add') renderAddForm();
  else if (tab === 'import') renderImport();
}

function showToast(msg, ok=true) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = ok ? '#28a745' : '#dc3545';
  t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000);
}

// ============ DASHBOARD ============
function renderDashboard() {
  // Compute CT status
  const now = new Date();
  const next7d = new Date(now); next7d.setDate(next7d.getDate() + 7);
  const next30d = new Date(now); next30d.setDate(next30d.getDate() + 30);
  
  let totalSKU = 0, activeNow = [], upcoming = [], allCT = [];
  
  groupedData.forEach(ct => {
    totalSKU += ct[4] || 0;
    const ctInfo = {
      ma: ct[0]||'', ten: ct[1]||'', loai: ct[2]||'', nhom: ct[3]||'',
      sku: ct[4]||0, skuList: ct[5]||'',
      ngayBD: ct[6], ngayKT: ct[7],
      bac: ct[10]||0, trung: ct[11]||0, nam: ct[12]||0, tay: ct[13]||0
    };
    allCT.push(ctInfo);
    
    // Determine status (handle both Date objects and text strings)
    let bd = ct[6] ? new Date(ct[6]) : null;
    let kt = ct[7] ? new Date(ct[7]) : null;
    if (bd && isNaN(bd.getTime())) bd = null;
    if (kt && isNaN(kt.getTime())) kt = null;
    
    if (bd && kt && bd <= now && kt >= now) {
      activeNow.push(ctInfo);
    } else if (bd && bd > now && bd <= next30d) {
      upcoming.push(ctInfo);
    } else if (!bd || !kt) {
      // Text-based dates: check if text suggests ongoing
      const ktStr = (ct[7]||'').toString().toLowerCase();
      if (ktStr.includes('đến khi có tb') || ktStr.includes('31.12.2026') || ktStr.includes('31/12/2026') || ktStr.includes('31.12.26')) {
        activeNow.push(ctInfo);
      }
    }
  });
  
  document.getElementById('mainContent').innerHTML = `
    <div class="stats">
      <div class="stat-card"><div class="num">${allCT.length}</div><div class="label">Tổng CTKM</div></div>
      <div class="stat-card" style="border-left:3px solid #28a745"><div class="num" style="color:#28a745">${activeNow.length}</div><div class="label">🟢 Đang hiệu lực</div></div>
      <div class="stat-card" style="border-left:3px solid #F9A825"><div class="num" style="color:#F9A825">${upcoming.length}</div><div class="label">🟡 Sắp diễn ra</div></div>
      <div class="stat-card"><div class="num">${totalSKU.toLocaleString()}</div><div class="label">Tổng SKU</div></div>
    </div>
    
    <!-- BỘ LỌC DASHBOARD (multi-select bằng tag) -->
    <div style="background:white;border-radius:8px;padding:10px 14px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)">
      <!-- Loại CTKM -->
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <span style="font-weight:600;color:#1F4E79;font-size:11px;white-space:nowrap;min-width:60px">Loại CTKM:</span>
        <div id="dashFilterLoai" style="display:flex;gap:4px;flex-wrap:wrap">
          ${[...new Set(allCT.map(r=>r.loai))].filter(Boolean).sort().map(v=>`<span class="filter-tag" data-val="${v}" onclick="toggleFilterTag(this,'loai')">${v}</span>`).join('')}
        </div>
      </div>
      <!-- Ngành MCH3 -->
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <span style="font-weight:600;color:#1F4E79;font-size:11px;white-space:nowrap;min-width:60px">Ngành:</span>
        <div id="dashFilterNhom" style="display:flex;gap:4px;flex-wrap:wrap">
          ${[...new Set(allCT.map(r=>r.nhom))].filter(Boolean).sort().map(v=>`<span class="filter-tag" data-val="${v}" onclick="toggleFilterTag(this,'nhom')">${v}</span>`).join('')}
        </div>
      </div>
      <!-- Miền + Thời gian -->
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-weight:600;color:#1F4E79;font-size:11px;white-space:nowrap;min-width:60px">Miền AD:</span>
        <div id="dashFilterMien" style="display:flex;gap:4px">
          <span class="filter-tag" data-val="bac" onclick="toggleFilterTag(this,'mien')">BẮC</span>
          <span class="filter-tag" data-val="trung" onclick="toggleFilterTag(this,'mien')">TRUNG</span>
          <span class="filter-tag" data-val="nam" onclick="toggleFilterTag(this,'mien')">NAM</span>
          <span class="filter-tag" data-val="tay" onclick="toggleFilterTag(this,'mien')">TÂY</span>
        </div>
        <span style="font-weight:600;color:#1F4E79;font-size:11px;white-space:nowrap;margin-left:12px">Thời gian:</span>
        <div id="dashFilterTime" style="display:flex;gap:4px">
          <span class="filter-tag" data-val="homNay" onclick="toggleFilterTag(this,'time',true)">Hôm nay</span>
          <span class="filter-tag" data-val="7ngay" onclick="toggleFilterTag(this,'time',true)">7 ngày</span>
          <span class="filter-tag" data-val="30ngay" onclick="toggleFilterTag(this,'time',true)">30 ngày</span>
          <span class="filter-tag" data-val="thangNay" onclick="toggleFilterTag(this,'time',true)">Tháng này</span>
          <span class="filter-tag" data-val="quyNay" onclick="toggleFilterTag(this,'time',true)">Quý này</span>
        </div>
        <span id="dashFilterCount" style="font-size:10px;color:#888;white-space:nowrap;margin-left:auto"></span>
      </div>
    </div>
    
    <h3 style="margin:20px 0 8px;color:#28a745">🟢 CTKM ĐANG HIỆU LỰC (<span id="activeCount">${activeNow.length}</span>)</h3>
    <div class="table-wrap" id="activeCTTable">${renderCTTable(activeNow)}</div>
    
    <h3 style="margin:20px 0 8px;color:#F9A825">🟡 CTKM SẮP DIỄN RA (<span id="upcomingCount">${upcoming.length}</span>)</h3>
    <div class="table-wrap" id="upcomingCTTable">${renderCTTable(upcoming)}</div>
    
    <h3 style="margin:20px 0 8px">📋 TẤT CẢ CTKM (<span id="allCount">${allCT.length}</span>)</h3>
    <div style="margin-bottom:12px">
      <select id="sortBy" onchange="refreshAllCT()" style="padding:6px 10px;border:1px solid #ddd;border-radius:4px">
        <option value="ten">Sắp xếp: Theo tên CTKM</option>
        <option value="nhom">Theo Nhóm hàng (MCH3)</option>
        <option value="gia">Theo Giá thường</option>
        <option value="giaKM">Theo Giá KM</option>
        <option value="pctKM">Theo % Giảm giá</option>
        <option value="dienGiai">Theo Diễn giải KM</option>
      </select>
    </div>
    <div class="table-wrap" id="allCTTable">${renderCTTable(allCT)}</div>
  `;
  // Store for filter
  window._allCT = allCT;
  window._activeNow = activeNow;
  window._upcoming = upcoming;
}

function toggleFilterTag(el, group, exclusive) {
  if (exclusive) {
    // Radio behavior: deselect all others in group
    document.querySelectorAll(`#dashFilterTime .filter-tag`).forEach(t => t.classList.remove('active'));
  }
  el.classList.toggle('active');
  applyDashFilter();
}

function getActiveTags(groupId) {
  return new Set([...document.querySelectorAll(`#${groupId} .filter-tag.active`)].map(t => t.dataset.val));
}

function applyDashFilter() {
  const selLoai = getActiveTags('dashFilterLoai');
  const selNhom = getActiveTags('dashFilterNhom');
  const selMien = getActiveTags('dashFilterMien');
  const selTime = [...getActiveTags('dashFilterTime')][0] || '';
  
  const now = new Date();
  const in7d = new Date(now); in7d.setDate(in7d.getDate()+7);
  const in30d = new Date(now); in30d.setDate(in30d.getDate()+30);
  
  const filterFn = r => {
    if (selLoai.size > 0 && !selLoai.has(r.loai)) return false;
    if (selNhom.size > 0 && !selNhom.has(r.nhom)) return false;
    if (selMien.size > 0) {
      let ok = false;
      if (selMien.has('bac') && r.bac) ok = true;
      if (selMien.has('trung') && r.trung) ok = true;
      if (selMien.has('nam') && r.nam) ok = true;
      if (selMien.has('tay') && r.tay) ok = true;
      if (!ok) return false;
    }
    if (selTime) {
      let bd = r.ngayBD ? new Date(r.ngayBD) : null;
      if (bd && isNaN(bd.getTime())) bd = null;
      if (!bd) return false;
      if (selTime === 'homNay' && !(bd <= now && r.ngayKT && new Date(r.ngayKT) >= now)) return false;
      if (selTime === '7ngay' && bd > in7d) return false;
      if (selTime === '30ngay' && bd > in30d) return false;
      if (selTime === 'thangNay' && (bd.getMonth()!==now.getMonth()||bd.getFullYear()!==now.getFullYear())) return false;
      if (selTime === 'quyNay' && (Math.floor(bd.getMonth()/3)!==Math.floor(now.getMonth()/3)||bd.getFullYear()!==now.getFullYear())) return false;
    }
    return true;
  };
  
  const filteredActive = window._activeNow.filter(filterFn);
  const filteredUpcoming = window._upcoming.filter(filterFn);
  const filteredAll = window._allCT.filter(filterFn);
  
  document.getElementById('activeCount').textContent = filteredActive.length;
  document.getElementById('upcomingCount').textContent = filteredUpcoming.length;
  document.getElementById('allCount').textContent = filteredAll.length;
  document.getElementById('activeCTTable').innerHTML = renderCTTable(filteredActive);
  document.getElementById('upcomingCTTable').innerHTML = renderCTTable(filteredUpcoming);
  allCT_cts = filteredAll;
  document.getElementById('allCTTable').innerHTML = renderCTTable(filteredAll);
  
  const parts = [];
  if (selLoai.size) parts.push(`${selLoai.size} loại`);
  if (selNhom.size) parts.push(`${selNhom.size} ngành`);
  if (selMien.size) parts.push(`${selMien.size} miền`);
  document.getElementById('dashFilterCount').textContent = parts.length ? `Đã chọn: ${parts.join(', ')} (${filteredAll.length} CT)` : `${filteredAll.length} CT`;
}

function refreshAllCT() {
  // Re-render all CT with sort
  const sortBy = document.getElementById('sortBy')?.value || 'ten';
  fetch(GAS_URL + '?action=getSKUData').then(r=>r.json()).then(skuData=>{
    // Build pricing per CT
    const ctPrice = {};
    skuData.forEach(row => {
      const ctName = (row[1]||'').toString();
      if (!ctName) return;
      if (!ctPrice[ctName]) ctPrice[ctName] = { prices: [], kmPrices: [], dienGiais: [] };
      const p = parseFloat(row[8]); // Giá thường (col 9)
      const km = parseFloat(row[9]); // Giá KM (col 10)
      const dg = (row[7]||'').toString(); // Diễn giải
      if (!isNaN(p)) ctPrice[ctName].prices.push(p);
      if (!isNaN(km)) ctPrice[ctName].kmPrices.push(km);
      if (dg) ctPrice[ctName].dienGiais.push(dg);
    });
    
    // Build enriched CT list
    const enriched = allCT_cts.map(ct => {
      const pData = ctPrice[ct.ten] || {};
      const avgPrice = pData.prices?.length ? pData.prices.reduce((a,b)=>a+b,0)/pData.prices.length : 0;
      const avgKM = pData.kmPrices?.length ? pData.kmPrices.reduce((a,b)=>a+b,0)/pData.kmPrices.length : 0;
      const pctKM = avgPrice > 0 ? ((avgPrice-avgKM)/avgPrice*100) : 0;
      return { ...ct, avgPrice, avgKM, pctKM, dienGiai: (pData.dienGiais||[]).join('; ').substring(0,60) };
    });
    
    // Sort
    if (sortBy === 'nhom') enriched.sort((a,b) => (a.nhom||'').localeCompare(b.nhom||''));
    else if (sortBy === 'gia') enriched.sort((a,b) => (b.avgPrice||0) - (a.avgPrice||0));
    else if (sortBy === 'giaKM') enriched.sort((a,b) => (b.avgKM||0) - (a.avgKM||0));
    else if (sortBy === 'pctKM') enriched.sort((a,b) => (b.pctKM||0) - (a.pctKM||0));
    else if (sortBy === 'dienGiai') enriched.sort((a,b) => (a.dienGiai||'').localeCompare(b.dienGiai||''));
    else enriched.sort((a,b) => (a.ten||'').localeCompare(b.ten||''));
    
    document.getElementById('allCTTable').innerHTML = renderCTTable(enriched);
  });
}

let allCT_cts = []; // cached for sort

function renderCTTable(data) {
  if (!data.length) return '<p style="padding:12px;color:#888">Không có CTKM nào</p>';
  allCT_cts = data;
  return `<table>
    <tr><th>Mã CT</th><th>Tên CTKM</th><th>Loại</th><th>Nhóm hàng</th><th>SKU</th><th>Ngày BĐ</th><th>Ngày KT</th><th>B</th><th>T</th><th>N</th><th>Ty</th></tr>
    ${data.map(r => `
      <tr>
        <td>${r.ma||''}</td>
        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.ten||''}">${(r.ten||'').substring(0,50)}</td>
        <td>${r.loai||''}</td><td>${r.nhom||''}</td><td>${r.sku||0}</td>
        <td>${fmtDate(r.ngayBD)}</td><td>${fmtDate(r.ngayKT)}</td>
        <td>${r.bac?'✓':''}</td><td>${r.trung?'✓':''}</td><td>${r.nam?'✓':''}</td><td>${r.tay?'✓':''}</td>
      </tr>
    `).join('')}
  </table>`;
}

// ============ DATA TABLE ============
function renderDataTable() {
  document.getElementById('mainContent').innerHTML = `
    <div class="filter-bar">
      <input id="filterSearch" placeholder="🔍 Tìm kiếm..." oninput="filterTable()">
      <select id="filterLoai" onchange="filterTable()">
        <option value="">Tất cả Phân loại</option>
        ${[...new Set(groupedData.map(r=>r[2]))].filter(Boolean).sort().map(v=>`<option>${v}</option>`).join('')}
      </select>
      <select id="filterNhom" onchange="filterTable()">
        <option value="">Tất cả Nhóm hàng</option>
        ${[...new Set(groupedData.map(r=>r[3]))].filter(Boolean).sort().map(v=>`<option>${v}</option>`).join('')}
      </select>
      <select id="filterMien" onchange="filterTable()">
        <option value="">Tất cả Miền</option>
        <option value="bac">BẮC</option><option value="trung">TRUNG</option>
        <option value="nam">NAM</option><option value="tay">TÂY</option>
      </select>
      <input id="filterDateFrom" type="date" onchange="filterTable()" title="Tu ngay hieu luc" style="width:140px">
      <input id="filterDateTo" type="date" onchange="filterTable()" title="Den ngay hieu luc" style="width:140px">
    </div>
    <div class="table-wrap" id="dataTable"></div>
  `;
  filterTable();
}

// SKU search - uses allData from GAS
let skuStoreMap = null;
function filterSKU() {
  const sku = (document.getElementById('filterSKU')?.value || '').trim().toLowerCase();
  if (!sku) { skuStoreMap = null; return filterTable(); }
  if (!skuStoreMap) {
    fetch(GAS_URL + '?action=getSKUData')
      .then(r => r.json())
      .then(skuData => {
        skuStoreMap = {};
        skuData.forEach(row => {
          const code = (row[4] || '').toString().toLowerCase();
          const ctName = (row[1] || '').toString();
          if (code && ctName) {
            if (!skuStoreMap[code]) skuStoreMap[code] = new Set();
            skuStoreMap[code].add(ctName);
          }
        });
        doSKUFilter();
      });
  } else { doSKUFilter(); }
}
function doSKUFilter() {
  const sku = (document.getElementById('filterSKU')?.value || '').trim().toLowerCase();
  let matched = new Set();
  if (sku && skuStoreMap) {
    Object.keys(skuStoreMap).forEach(code => {
      if (code.includes(sku)) skuStoreMap[code].forEach(ct => matched.add(ct));
    });
  }
  filterTable(matched.size > 0 ? matched : null);
}

function filterTable(skuMatchedCTs = null) {
  const search = (document.getElementById('filterSearch')?.value || '').toLowerCase();
  const loai = document.getElementById('filterLoai')?.value || '';
  const nhom = document.getElementById('filterNhom')?.value || '';
  const mienFilter = document.getElementById('filterMien')?.value || '';
  const mienIdx = {bac:10, trung:11, nam:12, tay:13}[mienFilter];
  const dateFrom = document.getElementById('filterDateFrom')?.value || '';
  const dateTo = document.getElementById('filterDateTo')?.value || '';
  
  let filtered = groupedData.filter(r => {
    const rowStr = Object.values(r).join(' ').toLowerCase();
    if (search && !rowStr.includes(search)) return false;
    if (loai && r[2] !== loai) return false;
    if (nhom && r[3] !== nhom) return false;
    if (mienIdx && !r[mienIdx]) return false;
    if (skuMatchedCTs && !skuMatchedCTs.has(r[1]?.toString())) return false;
    if (dateFrom && r[6]) {
      const d = new Date(r[6]);
      if (!isNaN(d) && d < new Date(dateFrom)) return false;
    }
    if (dateTo && r[7]) {
      const d = new Date(r[7]);
      if (!isNaN(d) && d > new Date(dateTo)) return false;
    }
    return true;
  });
  
  document.getElementById('dataTable').innerHTML = `
    <table>
      <tr><th>Mã CT</th><th>Tên CTKM</th><th>Phân loại</th><th>Nhóm hàng</th><th>SKU</th><th>Ngày BĐ</th><th>Ngày KT</th><th>B</th><th>T</th><th>N</th><th>Ty</th></tr>
      ${filtered.map(r => `
        <tr>
          <td>${r[0]||''}</td><td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r[1]||''}">${(r[1]||'').substring(0,50)}</td>
          <td>${r[2]||''}</td><td>${r[3]||''}</td><td>${r[4]||0}</td>
          <td>${fmtDate(r[6])}</td><td>${fmtDate(r[7])}</td>
          <td>${r[10]?'✓':''}</td><td>${r[11]?'✓':''}</td><td>${r[12]?'✓':''}</td><td>${r[13]?'✓':''}</td>
        </tr>
      `).join('')}
    </table>
    <p style="padding:12px;color:#888">Hiển thị ${filtered.length}/${groupedData.length} CT</p>
  `;
}

function submitForm() {
  const regions = document.querySelectorAll('#regionTags .region-tag.active');
  const allRegions = document.querySelectorAll('#regionTags .region-tag');
  
  // Auto-detect Toàn Quốc nếu chọn cả 4
  if (regions.length === 4) {
    const mienGoc = '1-TOÀN QUỐC';
  }
  
  const mienParts = [];
  if ([...regions].some(r=>r.textContent==='BẮC')) mienParts.push('BẮC');
  if ([...regions].some(r=>r.textContent==='TRUNG')) mienParts.push('TRUNG');
  if ([...regions].some(r=>r.textContent==='NAM')) mienParts.push('NAM');
  if ([...regions].some(r=>r.textContent==='TÂY')) mienParts.push('TÂY');
  
  let mienGoc = mienParts.length === 4 ? '1-TOÀN QUỐC' : mienParts.join(', ');
  
  const data = {
    maCT: document.getElementById('maCT').value,
    tenCTKM: document.getElementById('tenCTKM').value,
    phanLoaiMH: document.getElementById('phanLoaiMH').value,
    nhomHang: document.getElementById('nhomHang').value,
    maHang: document.getElementById('maHang').value,
    tenHang: document.getElementById('tenHang').value,
    dvt: document.getElementById('dvt').value,
    dienGiai: document.getElementById('dienGiai').value,
    giaThuong: document.getElementById('giaThuong').value,
    giaKM: document.getElementById('giaKM').value,
    ngayHLGiaMua: document.getElementById('ngayHLGiaMua').value,
    ngayKTGiaMua: document.getElementById('ngayKTGiaMua').value,
    ngayBDKM: document.getElementById('ngayBDKM').value,
    ngayKTKM: document.getElementById('ngayKTKM').value,
    tinhApDung: document.getElementById('tinhApDung').value,
    nhomStore: document.getElementById('nhomStore').value,
    tinhLoaiTru: document.getElementById('tinhLoaiTru').value,
    bac: [...regions].some(r=>r.textContent==='BẮC')?1:0,
    trung: [...regions].some(r=>r.textContent==='TRUNG')?1:0,
    nam: [...regions].some(r=>r.textContent==='NAM')?1:0,
    tay: [...regions].some(r=>r.textContent==='TÂY')?1:0,
    mienGoc: ''
  };
  
  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify({action: 'addNewCTKM', data: data})
  })
    .then(r => r.json())
    .then(resp => { showToast(resp.message || 'OK'); setTimeout(() => location.reload(), 1000); })
    .catch(err => showToast('Lỗi: ' + err, false));
}

function renderImport() {
  document.getElementById('mainContent').innerHTML = `

      <input type="file" id="importFile" accept=".xlsx,.xls" style="margin-bottom:12px">
      <br>
      <button class="btn btn-primary" onclick="doImport()">Import File</button>
      <div id="importStatus" style="margin-top:12px"></div>
    </div>
  `;
}

function doImport() {
  document.getElementById('importStatus').innerHTML = '⏳ Đang xử lý...';
  const file = document.getElementById('importFile').files[0];
  if (!file) { document.getElementById('importStatus').innerHTML = '❌ Chưa chọn file'; return; }
  
  const reader = new FileReader();
  reader.onload = function(e) {
    // Note: Full XLSX parsing in browser requires SheetJS library
    // For now, use the server-side GAS import
    google.script.run
      .withSuccessHandler(msg => document.getElementById('importStatus').innerHTML = msg)
      .processUploadedFile(file.name);
    document.getElementById('importStatus').innerHTML = '✅ File đã nhận. Đang import... kiểm tra Sheet sau vài giây.';
  };
  reader.readAsArrayBuffer(file);
}

function fmtDate(v) { if (!v) return ""; const d = new Date(v); if (isNaN(d.getTime())) return v; return d.toLocaleDateString("vi-VN"); }

// Init — dùng fetch() đến GAS Web App URL
const GAS_URL = localStorage.getItem('ctkm_gas_url') || '';
// Load directly from GitHub JSON (always works, no GAS needed)
Promise.all([
  fetch('https://ruralwcm.github.io/ctkm-rural/ctkm_grouped.json').then(r=>r.json()),
  fetch('https://ruralwcm.github.io/ctkm-rural/ctkm_sku.json').then(r=>r.json())
]).then(([grouped, sku]) => {
  groupedData = grouped;
  window._skuData = sku;
  renderDashboard();
}).catch(e => {
  document.getElementById('mainContent').innerHTML = '<p style="padding:40px;text-align:center">Loi tai du lieu. F5 thu lai.</p>';
});
