<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Khảo Sát Nhận Hàng</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#333}
.header{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.header h1{font-size:17px}
.header p{font-size:11px;opacity:0.8}
.tabs{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;position:sticky;top:0;z-index:10}
.tab{flex:1;text-align:center;padding:12px 8px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;color:#888;white-space:nowrap}
.tab.active{color:#2e7d32;border-bottom-color:#2e7d32}
.content{max-width:800px;margin:0 auto;padding:16px 12px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}
.stat-card .num{font-size:24px;font-weight:700;color:#2e7d32}
.stat-card.red .num{color:#c62828}
.stat-card .lbl{font-size:11px;color:#888;margin-top:2px}

/* Card */
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h3{font-size:14px;color:#2e7d32;margin-bottom:14px;display:flex;align-items:center;gap:6px}
label{display:block;font-size:12px;font-weight:600;margin-bottom:3px;color:#555}
select,input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:10px;background:#fff}
select:focus,input:focus{border-color:#2e7d32;outline:none}
.row{display:flex;gap:10px}.row>*{flex:1}

/* Filter bar */
.fbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.fbar select,.fbar input{width:auto;min-width:120px;margin-bottom:0;padding:8px 10px;font-size:12px}

/* Table */
.tbl-wrap{overflow-x:auto;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}
th{background:#f8f9fa;padding:8px 6px;text-align:left;font-weight:600;border-bottom:2px solid #dee2e6;white-space:nowrap;position:sticky;top:0}
td{padding:7px 6px;border-bottom:1px solid #eee}
tr:hover{background:#f8fdf8}
.green{color:#2e7d32;font-weight:600}.red{color:#c62828}
.badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-meat{background:#ffebee;color:#c62828}
.badge-veg{background:#e8f5e9;color:#2e7d32}
.badge-done{background:#c8e6c9;color:#1b5e20}

/* Progress bar */
.pbar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:3px}
.pbar-fill{height:100%;background:#2e7d32;border-radius:4px;transition:width .3s}

/* Buttons */
.btn{width:100%;padding:13px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-primary{background:#2e7d32;color:#fff}
.btn-outline{background:#fff;color:#2e7d32;border:2px solid #2e7d32}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:6px;color:#fff;font-weight:600;display:none;z-index:100;background:#2e7d32}

/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:12px;padding:24px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{margin-bottom:12px}

@media(max-width:480px){
  .header h1{font-size:14px}
  .tab{font-size:11px;padding:10px 4px}
  .stats{grid-template-columns:1fr 1fr}
  .row{flex-direction:column}
  .fbar{flex-direction:column}
  .fbar select{width:100%}
}
</style>
</head>
<body>
<div class="header">
  <div><h1>🥩🥬 Khảo Sát Nhận Hàng</h1><p>Thịt MDL & Rau-Trái cây · Chỉ khảo sát Hôm qua & Hôm nay</p></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">📝 Khảo sát</div>
  <div class="tab" onclick="switchTab(1)">📊 Dashboard</div>
  <div class="tab" onclick="switchTab(2)">📋 Danh sách</div>
</div>

<div class="content" id="main"></div>
<div class="toast" id="toast"></div>

<script>
// ===== DATA =====
let STORES = [
  {ma:'2797',ten:'WM+ HNI TTTM Cho Sui',gdv:'Pham Minh Thu',tinh:'TP. Ha Noi',qlkv:'Tran Thu Tra',mien:'Mien Bac'},
  {ma:'2924',ten:'WM+ HNI 391 Ngo Xuan Quang',gdv:'Pham Minh Thu',tinh:'TP. Ha Noi',qlkv:'Tran Thu Tra',mien:'Mien Bac'},
  {ma:'3088',ten:'WM+ HNI 38 Dao Cam Moc',gdv:'Pham Minh Thu',tinh:'TP. Ha Noi',qlkv:'Nguyen Thi Hanh',mien:'Mien Bac'},
  {ma:'3089',ten:'WM+ HNI 44 Lam Tien',gdv:'Pham Minh Thu',tinh:'TP. Ha Noi',qlkv:'Nguyen Thi Hanh',mien:'Mien Bac'},
  {ma:'3275',ten:'WM+ HNI 254 Co Bi',gdv:'Pham Minh Thu',tinh:'TP. Ha Noi',qlkv:'Tran Thu Tra',mien:'Mien Bac'},
  {ma:'3659',ten:'WM+ HNI Xom 8, Ninh Hiep',gdv:'Pham Minh Thu',tinh:'TP. Ha Noi',qlkv:'Nguyen Thu Ha',mien:'Mien Bac'},
  {ma:'3131',ten:'WM+ HNI Gian 1, Cho Giay',gdv:'Ta Cong Nhan',tinh:'TP. Ha Noi',qlkv:'Nguyen Van A',mien:'Mien Bac'},
  {ma:'3132',ten:'WM+ HNI Gian 2, Cho Giay',gdv:'Ta Cong Nhan',tinh:'TP. Ha Noi',qlkv:'Nguyen Van A',mien:'Mien Bac'},
  {ma:'5820',ten:'WM+ HNI 12 Nguyen Trai',gdv:'Ta Quoc Huy',tinh:'TP. Ha Noi',qlkv:'Tran Van B',mien:'Mien Bac'},
  {ma:'5821',ten:'WM+ HNI 88 Tran Duy Hung',gdv:'Ta Quoc Huy',tinh:'TP. Ha Noi',qlkv:'Tran Van B',mien:'Mien Bac'},
  {ma:'7100',ten:'WM+ BNI 5 Le Loi',gdv:'Ho Nam',tinh:'T. Bac Ninh',qlkv:'Le Thi C',mien:'Mien Bac'},
  {ma:'7101',ten:'WM+ BNI 8 Tran Hung Dao',gdv:'Ho Nam',tinh:'T. Bac Ninh',qlkv:'Le Thi C',mien:'Mien Bac'},
  {ma:'8200',ten:'WM+ HCM 22 Nguyen Hue',gdv:'Nguyen Thi Thu',tinh:'TP. HCM',qlkv:'Pham Van D',mien:'Mien Nam'},
];
const GAS_URL_NH = 'https://script.google.com/macros/s/AKfycbykaFmh6e3pUuWATtd3ZoMWssoy_lFgvaH7nEW-cZ1e0K_W1Wyes5DZpkzZRwoK8D04/exec';
let SURVEYS = JSON.parse(localStorage.getItem('ks_nhanhang')||'[]');
let gasLoaded = false;

// ===== ROBUST parseVal — handles all GAS/Sheets date-time formats =====
function parseVal(v,type){
  if(v==null||v===undefined||v==='')return '';
  
  // If already a clean DD/MM/YYYY or HH:MM string, pass through immediately
  if(typeof v==='string'&&v.indexOf('T')<0){
    if(v.indexOf(':')>-1&&v.indexOf('/')<0){
      // Time string → normalize "6:30" → "06:30"
      var parts=v.split(':'); if(parts.length>=2) return String(parseInt(parts[0])).padStart(2,'0')+':'+String(parseInt(parts[1])).padStart(2,'0');
    }
    if(v.indexOf('/')>-1) return v; // Already DD/MM/YYYY, pass through
  }
  
  // Case 1: Google Sheets serial NUMBER
  if(typeof v==='number'){
    if(v>59){
      // Date serial: days since Dec 30, 1899 → offset 25569 to Unix epoch
      var d=new Date((v-25569)*86400000);
      if(isNaN(d.getTime()))return String(v);
      var dd=new Date(d.getTime()+7*3600000);
      return String(dd.getUTCDate()).padStart(2,'0')+'/'+String(dd.getUTCMonth()+1).padStart(2,'0')+'/'+dd.getUTCFullYear();
    } else {
      var tm=Math.round(v*24*60);
      return String(Math.floor(tm/60)).padStart(2,'0')+':'+String(tm%60).padStart(2,'0');
    }
  }
  
  if(typeof v==='string'){
    // Case 2a: Google Sheets time "1899-12-30T..." or "1899-12-29T..."
    // GAS serializes time-only cells as Date near epoch. The UTC offset
    // reveals the script timezone. Common patterns:
    //   1899-12-29T17:xxZ  → GMT+7 (Asia/HCMC): 17+7=24→0h  next day in VN
    //   1899-12-30T06:xxZ  → UTC script: 6h = 6h GMT+7? No! UTC 6h = 13h VN.
    // Since user confirms all data is VN time (GMT+7), we detect the offset.
    if(v.indexOf('1899-12-')>-1){
      var mt=v.match(/T(\d{1,2}):(\d{2})/);
      if(mt){
        var hh=parseInt(mt[1],10), mm=parseInt(mt[2],10);
        // Detect script TZ from the date: Dec 29 = GMT+7 script, Dec 30 = UTC script
        if(v.indexOf('1899-12-29T')>-1){
          // Script is GMT+7: time was stored as VN local → serialized UTC = VN-7h
          // e.g. 06:30 VN → 23:30 UTC prev day → 23+7=30 → 30%24=6 → 06:30 ✓
          hh=(hh+7)%24;
        } else {
          // Script is UTC: time stored as UTC → serialized as-is
          // e.g. 06:30 UTC → 06:30 VN? NO! The user enters 06:30 VN time.
          // If GAS script is UTC, 06:30 VN = 23:30 UTC prev day → would be on Dec 29.
          // So if we see Dec 30 and script is UTC, the time IS Vietnam time stored raw.
          // This means the time was stored as a STRING, not Date → already correct.
          // Keep as-is (no adjustment needed for raw string time)
        }
        return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
      }
    }
    
    // Case 2b: ISO date string (NOT 1899)
    if(v.indexOf('T')>-1){
      var dt=new Date(v);
      if(!isNaN(dt.getTime())){
        if(type==='time'){
          var h3=dt.getUTCHours()+7, m3=dt.getUTCMinutes();
          if(h3>=24)h3-=24;
          return String(h3).padStart(2,'0')+':'+String(m3).padStart(2,'0');
        }
        var dd2=new Date(dt.getTime()+7*3600000);
        return String(dd2.getUTCDate()).padStart(2,'0')+'/'+String(dd2.getUTCMonth()+1).padStart(2,'0')+'/'+dd2.getUTCFullYear();
      }
    }
    return v;
  }
  
  // Case 3: JS Date object
  var d3=new Date(v);
  if(isNaN(d3.getTime()))return String(v);
  if(type==='time'){
    var h4=d3.getUTCHours()+7, m4=d3.getUTCMinutes();
    if(h4>=24)h4-=24;
    return String(h4).padStart(2,'0')+':'+String(m4).padStart(2,'0');
  }
  var dd3=new Date(d3.getTime()+7*3600000);
  return String(dd3.getUTCDate()).padStart(2,'0')+'/'+String(dd3.getUTCMonth()+1).padStart(2,'0')+'/'+dd3.getUTCFullYear();
}

async function loadFromGAS(){
  try{
    var resp=await fetch(GAS_URL_NH,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'getNhanHang'})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    var raw=await resp.json();
    if(Array.isArray(raw)&&raw.length>0){
      console.log('GAS raw data sample:', JSON.stringify(raw.slice(0,2)));
      // Build map from localStorage first (correct data format)
      var localMap={}; SURVEYS.forEach(function(s){localMap[s.ma+'|'+s.ngay]=s;});
      // GAS only fills in missing entries — never overrides localStorage
      raw.forEach(function(r){
        var s={
          gdv:r[0]||'', tinh:r[1]||'', ma:r[2]||'', ten:r[3]||'', qlkv:r[4]||'', mien:r[5]||'',
          ngay:parseVal(r[6],'date'), meat:parseVal(r[7],'time'), veg:parseVal(r[8],'time'), ts:r[9]||''
        };
        var key=s.ma+'|'+s.ngay;
        if(!localMap[key]){ localMap[key]=s; } // Only add if not already in localStorage
      });
      SURVEYS=Object.values(localMap);
      // Chi giu lai D-1 & Hom nay, huy data tuong lai
      var availDates=DAYS;
      SURVEYS=SURVEYS.filter(function(s){return availDates.indexOf(s.ngay)>=0;});
      localStorage.setItem('ks_nhanhang',JSON.stringify(SURVEYS));
      gasLoaded=true;
      console.log('GAS loaded: '+raw.length+' rows, filtered '+SURVEYS.length);
    }
  }catch(e){console.warn('GAS load failed:',e.message);}
}

// ===== COMMON =====
// Dynamic: chi hien thi Hom qua (D-1) & Hom nay (tranh khao sat nham ngay)
var WEEKDAYS=['CN','T2','T3','T4','T5','T6','T7'];
function getAvailDays(){
  var n=new Date();
  var pad=function(x){return String(x).padStart(2,'0')};
  var fmt=function(d){return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
  var today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var yest=new Date(today);yest.setDate(today.getDate()-1);
  return [
    {value:fmt(yest),label:WEEKDAYS[yest.getDay()]+' Hom qua '+fmt(yest)},
    {value:fmt(today),label:WEEKDAYS[today.getDay()]+' Hom nay '+fmt(today)}
  ];
}
var AVAIL_DAYS=getAvailDays();
var DAYS=AVAIL_DAYS.map(function(d){return d.value});
var DAY_LABELS=AVAIL_DAYS.map(function(d){return d.label});
function genTimes(){let s=[];for(let h=6;h<=18;h++)for(let m of[0,30]){if(h===18&&m===30)continue;s.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'))}return s}
const TIMES = genTimes();

function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
function switchTab(i){document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));render(i)}

// ===== TAB 0: SURVEY FORM =====
function renderSurvey(){
  let gdvs=[...new Set(STORES.map(s=>s.gdv))].sort();
  let tinhs=[...new Set(STORES.map(s=>s.tinh))].sort();
  document.getElementById('main').innerHTML=`
    <div class="card">
      <h3>🏪 Chọn cửa hàng</h3>
      <div class="row">
        <div><label>GĐV</label><select id="sgdv" onchange="filterStore()"><option value="">-- Chọn --</option>${gdvs.map(g=>`<option>${g}</option>`).join('')}</select></div>
        <div><label>Tỉnh/TP</label><select id="stinh" onchange="filterStore()"><option value="">-- Chọn --</option>${tinhs.map(t=>`<option>${t}</option>`).join('')}</select></div>
      </div>
      <label>Cửa hàng</label>
      <select id="sstore" onchange="onStoreSel()"><option value="">-- Chọn cửa hàng --</option></select>
      <div id="storeInfo" style="font-size:11px;color:#888;margin-top:-6px"></div>
    </div>
    <div class="card">
      <h3>📅 Ngày & Thời gian nhận hàng</h3>
      <label>Ngày nhận hàng</label>
      <select id="sday">${DAYS.map((d,i)=>`<option value="${d}">${DAY_LABELS[i]}</option>`).join('')}</select>
      <div class="row">
        <div><label>🥩 Nhận Thịt MDL</label><select id="smeat"><option value="">Không có lịch giao</option>${TIMES.map(t=>`<option value="${t.value}">${t.label}</option>`).join('')}</select></div>
        <div><label>🥬 Nhận Rau - Trái cây</label><select id="sveg"><option value="">Không có lịch giao</option>${TIMES.map(t=>`<option value="${t.value}">${t.label}</option>`).join('')}</select></div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="submitSurvey()">✅ Hoàn thành khảo sát</button>
  `;
  filterStore();
}
function filterStore(){
  let g=document.getElementById('sgdv')?.value||'', t=document.getElementById('stinh')?.value||'';
  let sel=document.getElementById('sstore'); if(!sel)return;
  sel.innerHTML='<option value="">-- Chọn cửa hàng --</option>';
  STORES.filter(s=>(!g||s.gdv===g)&&(!t||s.tinh===t)).forEach(s=>sel.innerHTML+=`<option value="${s.ma}" data-ten="${s.ten}" data-gdv="${s.gdv}" data-tinh="${s.tinh}" data-qlkv="${s.qlkv}" data-mien="${s.mien}">${s.ma} - ${s.ten}</option>`);
}
function onStoreSel(){
  let o=document.getElementById('sstore')?.selectedOptions[0];
  if(o&&o.dataset.ten) document.getElementById('storeInfo').textContent=`GĐV: ${o.dataset.gdv} | QLKV: ${o.dataset.qlkv} | Tỉnh: ${o.dataset.tinh} | Miền: ${o.dataset.mien}`;
}
function submitSurvey(){
  let o=document.getElementById('sstore')?.selectedOptions[0];
  if(!o||!o.dataset.ten) return showToast('⚠️ Vui lòng chọn cửa hàng');
  let meat=document.getElementById('smeat').value, veg=document.getElementById('sveg').value;
  if(!meat){showToast('⚠️ Vui lòng chọn giờ nhận Thịt (hoặc Không có lịch giao)','err');return;}
  if(!veg){showToast('⚠️ Vui lòng chọn giờ nhận Rau (hoặc Không có lịch giao)','err');return;}
  let d={
    ma:o.value, ten:o.dataset.ten, gdv:o.dataset.gdv, tinh:o.dataset.tinh, qlkv:o.dataset.qlkv, mien:o.dataset.mien,
    ngay:document.getElementById('sday').value, meat:meat, veg:veg, ts:new Date().toISOString()
  };
  SURVEYS.push(d); localStorage.setItem('ks_nhanhang',JSON.stringify(SURVEYS));
  showToast('✅ Đã lưu!');
  document.getElementById('smeat').value=''; document.getElementById('sveg').value='';
}

// ===== TAB 1: DASHBOARD =====
function renderDashboard(){
  let total=SURVEYS.length, meat=SURVEYS.filter(s=>s.meat).length, veg=SURVEYS.filter(s=>s.veg).length;
  let byDay={}; DAYS.forEach(d=>{byDay[d]={total:0,meat:0,veg:0}});
  SURVEYS.forEach(s=>{let d=byDay[s.ngay];if(d){d.total++;if(s.meat)d.meat++;if(s.veg)d.veg++}});
  let maxTotal=Math.max(1,...Object.values(byDay).map(d=>d.total));
  
  let gdvs=[...new Set(SURVEYS.map(s=>s.gdv))].sort();
  let tinhs=[...new Set(SURVEYS.map(s=>s.tinh))].sort();
  let qlkvs=[...new Set(SURVEYS.map(s=>s.qlkv))].sort();
  let miens=[...new Set(SURVEYS.map(s=>s.mien))].sort();
  
  document.getElementById('main').innerHTML=`
    <div class="stats">
      <div class="stat-card"><div class="num">${total}</div><div class="lbl">Tổng khảo sát</div></div>
      <div class="stat-card red"><div class="num">${meat}</div><div class="lbl">🥩 Có nhận Thịt</div></div>
      <div class="stat-card"><div class="num">${veg}</div><div class="lbl">🥬 Có nhận Rau</div></div>
      <div class="stat-card"><div class="num">${(total/STORES.length*100).toFixed(0)}%</div><div class="lbl">Độ phủ CH</div></div>
    </div>
    
    <div class="card"><h3>📈 Tiến độ theo ngày</h3>
      ${DAYS.map((d,i)=>{
        let dd=byDay[d];
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px">
            <span>${DAY_LABELS[i]}</span>
            <span>🥩${dd.meat} 🥬${dd.veg} / ${dd.total} CH</span>
          </div>
          <div class="pbar"><div class="pbar-fill" style="width:${dd.total/maxTotal*100}%"></div></div>
        </div>`;
      }).join('')}
    </div>
    
    <div class="card"><h3>📋 Kết quả khảo sát</h3>
      <div class="fbar">
        <select id="fMien" onchange="renderResultTable()"><option value="">Tất cả Miền</option>${miens.map(m=>`<option>${m}</option>`).join('')}</select>
        <select id="fTinh" onchange="renderResultTable()"><option value="">Tất cả Tỉnh</option>${tinhs.map(t=>`<option>${t}</option>`).join('')}</select>
        <select id="fGdv" onchange="renderResultTable()"><option value="">Tất cả GĐV</option>${gdvs.map(g=>`<option>${g}</option>`).join('')}</select>
        <select id="fQlkv" onchange="renderResultTable()"><option value="">Tất cả QLKV</option>${qlkvs.map(q=>`<option>${q}</option>`).join('')}</select>
      </div>
      <div class="tbl-wrap" id="barChart" style="margin-bottom:12px"></div>
      <div class="tbl-wrap" id="resultTable"></div>
    </div>
  `;
  renderResultTable();setTimeout(()=>{let d=document.getElementById('scheduleTable');if(d)d.innerHTML=renderScheduleTable();},100);
}
function renderScheduleTable(){
  let data=SURVEYS;
  let fm=document.getElementById('fMien')?.value||'', ft=document.getElementById('fTinh')?.value||'';
  let fg=document.getElementById('fGdv')?.value||'', fq=document.getElementById('fQlkv')?.value||'';
  data=data.filter(s=>(!fm||s.mien===fm)&&(!ft||s.tinh===ft)&&(!fg||s.gdv===fg)&&(!fq||s.qlkv===fq));
  
  // Build time slot grid: for each time, list stores
  let meatSlots={}, vegSlots={};
  data.forEach(s=>{
    if(s.meat){let k=s.meat;if(!meatSlots[k])meatSlots[k]=[];meatSlots[k].push(s.ma);}
    if(s.veg){let k=s.veg;if(!vegSlots[k])vegSlots[k]=[];vegSlots[k].push(s.ma);}
  });
  
  let allTimes=[...new Set([...Object.keys(meatSlots),...Object.keys(vegSlots)])].sort();
  if(!allTimes.length) return '<p style="padding:12px;color:#888">Chua co lich giao hang</p>';
  
  return '<table><tr><th>Gio</th><th>Thit MDL ('+Object.keys(meatSlots).length+' slot)</th><th>Rau-Trai cay ('+Object.keys(vegSlots).length+' slot)</th></tr>'+
    allTimes.map(t=>`<tr><td style="font-weight:600">${t}</td><td>${(meatSlots[t]||[]).map(m=>'<span class="badge badge-meat">'+m+'</span>').join(' ')||'-'}</td><td>${(vegSlots[t]||[]).map(m=>'<span class="badge badge-veg">'+m+'</span>').join(' ')||'-'}</td></tr>`).join('')+
    '</table>';
}

function renderResultTable(){
  let fm=document.getElementById('fMien')?.value||'', ft=document.getElementById('fTinh')?.value||'';
  let fg=document.getElementById('fGdv')?.value||'', fq=document.getElementById('fQlkv')?.value||'';
  let data=SURVEYS.filter(s=>(!fm||s.mien===fm)&&(!ft||s.tinh===ft)&&(!fg||s.gdv===fg)&&(!fq||s.qlkv===fq));
  // Group by store
  let grp={}; data.forEach(s=>{let k=s.ma;if(!grp[k])grp[k]={ma:s.ma,ten:s.ten,gdv:s.gdv,tinh:s.tinh,qlkv:s.qlkv,mien:s.mien,meat:0,veg:0,days:new Set()};grp[k].meat+=s.meat?1:0;grp[k].veg+=s.veg?1:0;grp[k].days.add(s.ngay)});
  let rows=Object.values(grp).sort((a,b)=>a.ten.localeCompare(b.ten,'vi'));
  
  // ===== TWO SEPARATE SVG COLUMN CHARTS: Rau + Thit =====
  var allSlots=[]; for(var hh=0;hh<24;hh++)for(var mm of[0,30])allSlots.push(String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'));
  
  var meatCounts={}, vegCounts={}; allSlots.forEach(function(k){meatCounts[k]=0;vegCounts[k]=0;});
  data.forEach(function(s){
    if(s.meat && s.meat!=='Không có lịch giao' && meatCounts.hasOwnProperty(s.meat)) meatCounts[s.meat]++;
    if(s.veg && s.veg!=='Không có lịch giao' && vegCounts.hasOwnProperty(s.veg)) vegCounts[s.veg]++;
    // Also try with normalized key (handle "6:30" vs "06:30")
    if(s.meat && s.meat!=='Không có lịch giao'){
      var nk=String(parseInt(s.meat.split(':')[0])).padStart(2,'0')+':'+String(parseInt(s.meat.split(':')[1]||'0')).padStart(2,'0');
      if(nk!==s.meat && meatCounts.hasOwnProperty(nk)) meatCounts[nk]++;
    }
    if(s.veg && s.veg!=='Không có lịch giao'){
      var nk2=String(parseInt(s.veg.split(':')[0])).padStart(2,'0')+':'+String(parseInt(s.veg.split(':')[1]||'0')).padStart(2,'0');
      if(nk2!==s.veg && vegCounts.hasOwnProperty(nk2)) vegCounts[nk2]++;
    }
  });

  var chartH=160, barW=10, colGap=2, colW=barW+colGap;
  var svgW=allSlots.length*colW+30;

  // Generate X-axis labels (every 2h)
  var xLabels='';
  allSlots.forEach(function(t,i){
    if(i%4===0)xLabels+='<text x="'+(i*colW+20)+'" y="'+(chartH+16)+'" font-size="9" fill="#888" text-anchor="middle">'+(t.slice(0,2).replace(/^0/,'')+'h')+'</text>';
  });

  // Grid lines
  function gridLines(max){var g='';for(var gy=0;gy<=chartH;gy+=chartH/4){g+='<line x1="20" y1="'+(chartH-gy)+'" x2="'+(svgW-10)+'" y2="'+(chartH-gy)+'" stroke="#eee" stroke-width="0.5"/>';g+='<text x="22" y="'+(chartH-gy+3)+'" font-size="8" fill="#ccc">'+Math.round(gy/chartH*max)+'</text>';}return g;}

  // ===== CHART 1: RAU =====
  var vegMax=Math.max(1,Math.max.apply(null,allSlots.map(function(k){return vegCounts[k]})));
  var vegHasData=vegMax>0;
  var vegBars='';
  allSlots.forEach(function(t,i){
    var vc=vegCounts[t];
    if(vc>0){
      var vh=Math.max(2,Math.round(vc/vegMax*chartH));
      var x=i*colW+20;
      vegBars+='<rect x="'+x+'" y="'+(chartH-vh)+'" width="'+barW+'" height="'+vh+'" fill="#66bb6a" rx="2"><title>Rau '+t+' ('+vc+' CH)</title></rect>';
      vegBars+='<text x="'+(x+barW/2)+'" y="'+(chartH-vh-4)+'" font-size="9" fill="#2e7d32" font-weight="600" text-anchor="middle">'+vc+'</text>';
    }
  });

  var vegChart='<div style="margin-bottom:20px">';
  vegChart+='<h4 style="font-size:13px;color:#2e7d32;margin-bottom:8px">🥬 Số CH được giao Rau theo khung giờ (0h-23h)</h4>';
  vegChart+='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">';
  vegChart+='<svg width="'+svgW+'" height="'+(chartH+24)+'" style="display:block;font-family:Segoe UI,Arial,sans-serif">';
  vegChart+=gridLines(vegMax);
  vegChart+=xLabels;
  if(!vegHasData)vegChart+='<text x="'+Math.round(svgW/2)+'" y="'+(chartH/2)+'" font-size="14" fill="#aaa" text-anchor="middle">Chua co du lieu Rau</text>';
  vegChart+=vegBars;
  vegChart+='</svg></div></div>';

  // ===== CHART 2: THIT =====
  var meatMax=Math.max(1,Math.max.apply(null,allSlots.map(function(k){return meatCounts[k]})));
  var meatHasData=meatMax>0;
  var meatBars='';
  allSlots.forEach(function(t,i){
    var mc=meatCounts[t];
    if(mc>0){
      var mh=Math.max(2,Math.round(mc/meatMax*chartH));
      var x=i*colW+20;
      meatBars+='<rect x="'+x+'" y="'+(chartH-mh)+'" width="'+barW+'" height="'+mh+'" fill="#ef5350" rx="2"><title>Thit '+t+' ('+mc+' CH)</title></rect>';
      meatBars+='<text x="'+(x+barW/2)+'" y="'+(chartH-mh-4)+'" font-size="9" fill="#c62828" font-weight="600" text-anchor="middle">'+mc+'</text>';
    }
  });

  var meatChart='<div style="margin-bottom:20px">';
  meatChart+='<h4 style="font-size:13px;color:#c62828;margin-bottom:8px">🥩 Số CH được giao Thịt theo khung giờ (0h-23h)</h4>';
  meatChart+='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">';
  meatChart+='<svg width="'+svgW+'" height="'+(chartH+24)+'" style="display:block;font-family:Segoe UI,Arial,sans-serif">';
  meatChart+=gridLines(meatMax);
  meatChart+=xLabels;
  if(!meatHasData)meatChart+='<text x="'+Math.round(svgW/2)+'" y="'+(chartH/2)+'" font-size="14" fill="#aaa" text-anchor="middle">Chua co du lieu Thit</text>';
  meatChart+=meatBars;
  meatChart+='</svg></div></div>';

  document.getElementById('barChart').innerHTML=vegChart+meatChart+vegTable+meatTable;
  document.getElementById('resultTable').innerHTML=`
    <table><tr><th>Mã CH</th><th>Tên CH</th><th>GĐV</th><th>QLKV</th><th>Miền</th><th>Tỉnh</th><th>🥩 Thịt</th><th>🥬 Rau</th><th>Số ngày</th></tr>
    ${rows.map(r=>`<tr><td>${r.ma}</td><td>${r.ten}</td><td>${r.gdv}</td><td>${r.qlkv}</td><td>${r.mien}</td><td>${r.tinh}</td><td class="red">${r.meat||'-'}</td><td class="green">${r.veg||'-'}</td><td>${r.days.size}/7</td></tr>`).join('')}
    </table><p style="padding:10px;color:#888;font-size:12px">${rows.length} CH / ${data.length} khảo sát</p>`;
}

// ===== TAB 2: ALL ENTRIES =====
function renderList(){
  let data=[...SURVEYS].reverse();
  document.getElementById('main').innerHTML=`
    <div style="margin-bottom:12px">
      <button class="btn btn-outline" onclick="exportCSV()">📥 Xuất Excel (CSV)</button>
      <button class="btn btn-outline" style="margin-top:4px" onclick="if(confirm('Xóa tất cả?')){SURVEYS=[];localStorage.removeItem('ks_nhanhang');render(2)}">🗑 Xóa tất cả</button>
    </div>
    <div class="tbl-wrap"><table>
      <tr><th>Ngày</th><th>Mã CH</th><th>Tên CH</th><th>GĐV</th><th>Tỉnh</th><th>QLKV</th><th>🥩 Thịt</th><th>🥬 Rau</th></tr>
      ${data.map(s=>`<tr><td>${s.ngay}</td><td>${s.ma}</td><td>${s.ten||''}</td><td>${s.gdv}</td><td>${s.tinh}</td><td>${s.qlkv}</td><td>${s.meat||'-'}</td><td>${s.veg||'-'}</td></tr>`).join('')}
    </table></div>
    <p style="padding:10px;color:#888;font-size:12px">${data.length} khảo sát</p>`;
}
function exportCSV(){
  let csv='GDV,Tinh,Ma CH,Ten CH,Ngay nhan hang,Thoi gian nhan Thit MDL,Thoi gian nhan Rau-Trai cay,QLKV,Mien\n';
  SURVEYS.forEach(s=>csv+=`${s.gdv},${s.tinh},${s.ma},${s.ten||''},${s.ngay},${s.meat||''},${s.veg||''},${s.qlkv},${s.mien}\n`);
  let b=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='KhaoSat_NhanHang_0510_1110.csv';a.click();
}

// ===== INIT =====
function render(i){[renderSurvey,renderDashboard,renderList][i]()}
function cleanOldData(){
  var availDates=DAYS;
  var before=SURVEYS.length;
  SURVEYS=SURVEYS.filter(function(s){return availDates.indexOf(s.ngay)>=0;});
  if(SURVEYS.length<before) localStorage.setItem('ks_nhanhang',JSON.stringify(SURVEYS));
}
async function initApp(){cleanOldData();await loadFromGAS();render(0);}
initApp();
</script>
